<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Rudraksh's IT Geek Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT Geek">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#26214f;--soft:#6b66a3;--eng:#ff5c8a;--mth:#3d8bff;--cs:#7c4dff;--ok:#2fbf71;--bad:#ff6b57;--sun:#ffc833;--glass:rgba(255,255,255,.82);--r:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;font-family:'Fredoka',ui-rounded,-apple-system,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:radial-gradient(circle at 15% 10%,#ffd9ec 0,transparent 45%),radial-gradient(circle at 90% 20%,#cfe3ff 0,transparent 45%),radial-gradient(circle at 50% 100%,#e2d6ff 0,transparent 55%),#f4f0ff;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,h4{margin:.2em 0}
b{font-weight:700}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 22px 26px;display:none}
.screen.active{display:block;animation:pop .35s ease}
.wrap{max-width:900px;margin:0 auto}
.center{text-align:center}
.sub{color:var(--soft);font-size:20px;margin:.3em 0 1em}
small{color:var(--soft)}
#tabs{display:flex;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid rgba(124,77,255,.15);box-shadow:0 -6px 24px rgba(80,60,160,.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--soft)}
.tab i{font-style:normal;font-size:30px;line-height:1.1;transition:transform .2s}
.tab.on{color:var(--cs)}
.tab.on i{transform:scale(1.2) translateY(-2px)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:var(--r);padding:20px;margin:0 0 16px;box-shadow:0 8px 28px rgba(80,60,160,.12);border:1px solid rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;border-radius:22px;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f5bff,#5a8bff);box-shadow:0 8px 18px rgba(100,80,220,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.big{min-height:72px;font-size:26px;padding:0 40px}
.btn.ok{background:linear-gradient(135deg,#34c77b,#1fa3a3);box-shadow:0 8px 18px rgba(30,160,120,.35)}
.btn.warn{background:linear-gradient(135deg,#ff8a5c,#ff5c8a);box-shadow:0 8px 18px rgba(255,92,120,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(80,60,160,.15)}
.btn[disabled]{opacity:.4;box-shadow:none}
.btn.sm{min-height:46px;font-size:17px;padding:0 18px;border-radius:16px}
.icon{width:54px;height:54px;border-radius:18px;background:#fff;font-size:24px;box-shadow:0 4px 12px rgba(80,60,160,.15);flex:none}
button#vClose{color:#26214f}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:600;font-size:16px;background:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center}
.row>*{margin:6px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,51,.9)}50%{box-shadow:0 0 0 12px rgba(255,200,51,0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(6deg)}}
@keyframes scanl{0%{top:6%}100%{top:90%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* splash */
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.byte{font-size:150px;line-height:1;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(80,60,160,.3))}
.title{font-size:54px;margin:.1em 0;background:linear-gradient(90deg,#ff5c8a,#7c4dff,#3d8bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.floaty{position:absolute;font-size:54px;animation:floaty 5s ease-in-out infinite;opacity:.85}
.floaty.f1{left:10%;top:12%}.floaty.f2{right:12%;top:16%;animation-delay:.8s}.floaty.f3{left:14%;bottom:16%;animation-delay:1.6s}.floaty.f4{right:16%;bottom:20%;animation-delay:2.4s}.floaty.f5{left:46%;top:6%;animation-delay:3s}
/* home */
.hero{display:flex;align-items:center}
.hero .byte{font-size:92px;animation-duration:2.6s}
.bubble{background:#fff;border-radius:24px 24px 24px 6px;padding:14px 20px;font-size:21px;margin-left:12px;box-shadow:0 6px 18px rgba(80,60,160,.12)}
.stats{display:flex;flex-wrap:wrap;margin:0 -6px 6px}
.stat{flex:1;min-width:150px;margin:6px;padding:14px 16px;border-radius:22px;background:var(--glass);box-shadow:0 6px 18px rgba(80,60,160,.1);text-align:center}
.stat b{font-size:30px;display:block}
.bar{height:14px;border-radius:99px;background:rgba(124,77,255,.15);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc833,#ff5c8a);border-radius:99px;transition:width .6s}
.todayc{background:linear-gradient(135deg,#7c4dff,#3d8bff);color:#fff}
.todayc .sub{color:#e8e2ff}
.doms{display:flex;flex-wrap:wrap;margin:10px -5px 0}
.dchip{flex:1;min-width:130px;margin:5px;padding:12px;border-radius:18px;background:rgba(255,255,255,.2);text-align:center;font-weight:600;font-size:18px}
.badges{display:flex;flex-wrap:wrap}
.bdg{font-size:38px;margin:4px 10px 4px 0;filter:grayscale(1);opacity:.35}
.bdg.on{filter:none;opacity:1}
/* worksheet */
.wtop{display:flex;align-items:center;margin-bottom:10px}
.wtop>*{margin-right:10px}
.pillD{padding:8px 16px;border-radius:99px;color:#fff;font-weight:700;font-size:18px;white-space:nowrap}
.dots{flex:1;display:flex;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(38,33,79,.15);margin:3px}
.dot.ok{background:var(--ok)}.dot.no{background:var(--sun)}.dot.cur{outline:3px solid var(--cs);outline-offset:2px}
.qcard{background:var(--glass);border-radius:30px;padding:22px;box-shadow:0 10px 30px rgba(80,60,160,.14)}
.qprompt{font-size:29px;font-weight:600;text-align:center;line-height:1.25}
.qvis{margin:12px 0;text-align:center}
.bigemoji{font-size:90px;line-height:1.1}
.svgi{width:96px;height:96px}
.sent{font-size:34px;font-weight:600;margin:6px 0}
.blank{display:inline-block;min-width:90px;border-bottom:5px solid var(--cs);color:var(--cs);text-align:center;margin:0 6px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:14px;margin-top:10px}
.opts.c1{grid-template-columns:1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{min-height:92px;border-radius:24px;background:#fff;font-size:36px;font-weight:700;padding:10px;border:4px solid transparent;box-shadow:0 6px 16px rgba(80,60,160,.14);transition:transform .12s,background .2s}
.opt:active{transform:scale(.96)}
.opt .em{font-size:60px;display:block;line-height:1.1}
.opt .nm{font-size:22px;display:block}
.opt .svgi{width:68px;height:68px}
.opt.ok{background:#d6f8e5;border-color:var(--ok);animation:bounce .5s}
.opt.bad{background:#ffe1dc;border-color:var(--bad);animation:shake .4s}
.opt.dim{opacity:.35;pointer-events:none}
.fb{min-height:54px;margin-top:12px;border-radius:18px;padding:10px 16px;font-size:21px;font-weight:600;text-align:center;display:none}
.fb.show{display:block;animation:fadeUp .25s}
.fb.ok{background:#d6f8e5;color:#127a47}.fb.bad{background:#ffe9e4;color:#b8412f}.fb.info{background:#e8e2ff;color:#4a3bb0}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.emojirow{font-size:44px;line-height:1.25;max-width:640px;margin:0 auto}
.emojirow .g{display:inline-block;margin:4px 12px;white-space:nowrap}
.emojirow .out{opacity:.25;position:relative}
.emojirow .out:after{content:'\274C';position:absolute;left:4px;top:4px;font-size:30px;opacity:1}
.lineup{font-size:60px;white-space:nowrap}.lineup small{font-size:20px}
.seq{display:flex;justify-content:center;flex-wrap:wrap}
.sb{min-width:76px;height:76px;margin:5px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;box-shadow:0 4px 12px rgba(80,60,160,.14)}
.sb.q{background:#fff6cf;border:4px dashed var(--sun);color:var(--sun)}
.numcard{font-size:64px}
.eq{font-size:58px;font-weight:700;margin-top:6px}
.passage{background:#fffdf3;border:3px dashed #ffd978;border-radius:22px;padding:14px 20px;text-align:left;font-size:25px;line-height:1.5;max-width:700px;margin:0 auto}
.passage h4{font-size:24px;color:var(--eng)}
.sayb{margin-top:6px;background:#fff;padding:8px 16px;border-radius:14px;font-size:18px;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.scene{position:relative;width:270px;height:190px;margin:0 auto}
.scene.mini{transform:scale(.55);margin:-40px -40px -34px}
.scene span{position:absolute;line-height:1;transform:translate(-50%,-50%)}
.sc-in .L{left:50%;top:60%;font-size:120px;z-index:2}.sc-in .S{left:50%;top:32%;font-size:64px;z-index:1}
.sc-on .L{left:50%;top:70%;font-size:110px}.sc-on .S{left:50%;top:24%;font-size:72px}
.sc-under .L{left:50%;top:28%;font-size:110px}.sc-under .S{left:50%;top:80%;font-size:60px}
.sc-behind .L{left:38%;top:55%;font-size:120px;z-index:2}.sc-behind .S{left:62%;top:58%;font-size:80px;z-index:1}
.sc-nextto .L{left:26%;top:55%;font-size:100px}.sc-nextto .S{left:74%;top:60%;font-size:80px}
/* grid */
.gridq{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;width:330px;margin:10px auto}
.gcell{height:96px;border-radius:18px;background:#fff;font-size:52px;box-shadow:0 4px 10px rgba(80,60,160,.14);border:4px solid transparent}
.gcell.ok{background:#d6f8e5;border-color:var(--ok)}.gcell.bad{background:#ffe1dc;animation:shake .4s}
/* keyboard */
.kb{background:#3a3566;border-radius:22px;padding:10px 8px 4px;margin:12px auto 0;max-width:860px}
.kr{display:flex;justify-content:center;margin-bottom:7px}
.k{position:relative;flex:1;min-width:0;height:62px;margin:0 3px;border-radius:12px;font-size:24px;font-weight:700;color:var(--ink);border-bottom:4px solid rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.k:active{transform:translateY(3px);border-bottom-width:1px}
.k.bump:after{content:'';position:absolute;bottom:7px;width:16px;height:4px;border-radius:2px;background:rgba(38,33,79,.5)}
.k.sp{font-size:15px;flex:1.7}.k.sp-SPACE{flex:7;font-size:18px}.k.sp-BACK{flex:1.9}.k.sp-SHIFT{flex:2}.k.sp-ENTER{flex:2.2}
.f0{background:#ffb3cc}.f1{background:#ffcc99}.f2{background:#fff0a0}.f3{background:#b5f0c0}.f4{background:#aeeaf5}.f5{background:#b9c8ff}.f6{background:#d8bcff}.f7{background:#f3b8f0}.f8{background:#e3e1f7}
.k.hint{animation:pulse 1s infinite;transform:scale(1.08);z-index:2}
.k.ok{background:var(--ok);color:#fff}.k.no{animation:shake .35s;background:var(--bad);color:#fff}
.tcopy{font-size:54px;font-weight:700;letter-spacing:8px;color:var(--cs)}
.tbox{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tbox.long .tb{width:42px;height:56px;font-size:30px;margin:0 3px 6px}.tbox.long .tb.sp{width:22px}
.tb{width:56px;height:68px;margin:0 5px;border-radius:14px;background:#fff;border-bottom:6px solid #c9c4ee;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tb.sp{width:34px}
.tb.cur{border-color:var(--sun);animation:pulse 1.2s infinite}.tb.done{background:#d6f8e5;border-color:var(--ok);color:#127a47}
/* drag */
.slots{display:grid;grid-gap:12px;margin-bottom:12px}
.slots.s2{grid-template-columns:1fr 1fr}.slots.s1{grid-template-columns:1fr}
.slot{border:4px dashed #b9b3e8;border-radius:22px;background:rgba(255,255,255,.7);padding:10px;text-align:center;min-height:100px}
.slot.over{border-color:var(--sun);background:#fff8dc}
.slot .sl{font-size:48px;line-height:1.1;font-weight:700}
.slot .sl .svgi{width:70px;height:70px}
.slot .sl small{font-size:17px;font-weight:600;display:block}
.drop{min-height:62px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.slots.s1 .slot{display:flex;align-items:center}.slots.s1 .slot .sl{flex:none;margin-right:16px;min-width:120px}.slots.s1 .slot .drop{flex:1}
.tray{display:flex;flex-wrap:wrap;justify-content:center;min-height:80px;padding:8px;border-radius:20px;background:rgba(124,77,255,.08)}
.chip{display:inline-flex;align-items:center;margin:6px;padding:10px 20px;border-radius:18px;background:#fff;font-size:28px;font-weight:700;box-shadow:0 5px 12px rgba(80,60,160,.2);touch-action:none;-webkit-user-select:none}
.chip .ci{font-size:38px;margin-right:8px}.chip .svgi{width:44px;height:44px;margin-right:8px}
.chip.sel{outline:5px solid var(--sun)}.chip.lock{background:#d6f8e5;pointer-events:none}.chip.ghost{opacity:.25}.chip.no{animation:shake .4s;background:#ffe1dc}
.chip.fly{position:fixed;z-index:999;pointer-events:none;transform:scale(1.12) rotate(-3deg);margin:0}
.dzfoot{text-align:center;margin-top:12px}
/* done */
.trophy{font-size:110px;animation:bounce 1.6s infinite}
.starsRow{display:flex;flex-wrap:wrap;justify-content:center}
.sc{margin:6px;padding:14px 22px;border-radius:22px;color:#fff;font-weight:700;text-align:center;font-size:20px}
.sc b{display:block;font-size:32px;letter-spacing:3px}
.qrCard{text-align:center}
#qrBox{display:inline-block;padding:16px;background:#fff;border-radius:24px;box-shadow:0 8px 22px rgba(80,60,160,.2)}
#qrBox img,#qrBox canvas{display:block}
.lockq{padding:34px 10px;font-size:22px}
.lockq .big{font-size:80px}
/* scan */
.camwrap{position:relative;max-width:560px;min-height:300px;margin:0 auto;border-radius:28px;overflow:hidden;background:#1d1a3d;aspect-ratio:1/1;box-shadow:0 10px 30px rgba(80,60,160,.3)}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .ph{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfcdf5;font-size:22px;text-align:center;padding:20px}
.frame{position:absolute;left:14%;top:14%;right:14%;bottom:14%;border:5px solid rgba(255,255,255,.9);border-radius:26px;display:none}
.frame i{position:absolute;left:6%;right:6%;height:4px;background:var(--sun);box-shadow:0 0 12px var(--sun);animation:scanl 1.8s linear infinite alternate}
.camwrap.live .frame{display:block}.camwrap.live .ph{display:none}
/* lab */
.fact{text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}
.fact .e{font-size:84px}.fact p{font-size:23px;margin:.3em 0}
.steps{display:flex;flex-wrap:wrap;justify-content:center}
.stp{width:150px;margin:8px;padding:12px;border-radius:20px;background:#fff;text-align:center;font-size:17px;box-shadow:0 5px 14px rgba(80,60,160,.12);opacity:0;animation:fadeUp .5s forwards}
.stp i{font-style:normal;font-size:48px;display:block}
.games{display:flex;flex-wrap:wrap}
.game{flex:1;min-width:200px;margin:6px;padding:18px;border-radius:22px;color:#fff;font-weight:700;font-size:21px;text-align:center}
.game i{font-style:normal;font-size:46px;display:block}
/* parent */
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:4px;font-size:17px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field input[type=url],.field select{width:100%;height:54px;border-radius:16px;border:2px solid #d9d4f5;padding:0 14px;font-size:19px;background:#fff;color:var(--ink)}
.chrow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.chrow input[type=text]{flex:1;height:44px;font-size:15px;margin-left:10px;border-radius:12px;border:2px solid #d9d4f5;padding:0 10px}
.chrow input[type=checkbox]{width:28px;height:28px;margin-right:10px}
.note{font-size:16px;padding:12px 16px;border-radius:16px;background:#fff5d6;color:#7a5a00;margin:8px 0}
.good{background:#d6f8e5;color:#127a47}.badn{background:#ffe9e4;color:#b8412f}
/* modal/video/toast */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(38,33,79,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:pop .25s}
.sheet{background:#fff;border-radius:32px;padding:26px;max-width:640px;width:100%;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h2{font-size:30px}
.sheet .big{font-size:92px;text-align:center;line-height:1.1}
.sheet p{font-size:21px;line-height:1.4}
.sheet .row{justify-content:center;margin-top:10px}
#vid{position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;background:#0c0a22;display:none;flex-direction:column}
#vid.on{display:flex}
.vbar{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;color:#fff;font-size:20px;font-weight:600}
.vbar #vTitle{flex:1}.vbar #vTime{margin-right:14px;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:99px;font-size:17px}
.vbox{flex:1;position:relative;min-height:0}
#ytWrap{position:absolute;left:0;top:0;right:0;bottom:0;background:#000}#ytWrap iframe,#ytWrap #ytMount{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
/* shields keep the child inside the app: they cover the YouTube title/share links (top) and logo link (bottom-right) */
.vshield{position:absolute;z-index:2;background:transparent}.vs-top{left:0;right:0;top:0;height:76px}.vs-br{right:0;bottom:0;width:150px;height:58px}
/* message is a banner only: it must never hide YouTube's own play button (iOS needs a real tap on it) */
#vCover{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;display:none;pointer-events:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:30px;font-weight:700;-webkit-tap-highlight-color:transparent}
#vCover.live{display:flex;pointer-events:auto;background:transparent}
#vCover.paused{display:flex;pointer-events:auto;background:linear-gradient(135deg,#2b2060,#5a3cc8)}
#vCover .vbig{font-size:110px;line-height:1.1}#vCover .btn{margin-top:18px;font-size:30px;min-width:260px}
.vbar .icon{margin-left:8px;background:rgba(255,255,255,.18);color:#fff}
#vMsg{position:absolute;z-index:3;left:14px;right:14px;top:10px;display:none;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;text-align:center;padding:12px 18px;border-radius:20px;background:rgba(124,77,255,.92);pointer-events:none}

.wemoji{font-size:64px;line-height:1.1}.wemoji.pop{animation:blkpop .35s}.wemoji.silly{animation:wobble .8s ease-in-out infinite}.wemoji.bounce{animation:micp .5s ease-in-out 3}

.wbadge{display:inline-block;padding:4px 16px;border-radius:99px;font-weight:800;font-size:19px;margin:4px 0}.wbadge.real{background:#d9f7e6;color:#127a47}.wbadge.silly{background:#ece5ff;color:#6b3fd6}
.wsub{color:#7a5aa8;font-weight:700;font-size:15px}.wcount{margin-top:6px;font-size:14px;color:#7a5aa8;font-weight:700}
.wclue{background:#fff7d6;border:3px solid #ffc833;border-radius:18px;padding:8px 10px;margin-bottom:8px;font-size:18px;font-weight:700}.wclue .wch{display:block;font-size:14px;color:#c07a00}
.wsent{margin-top:8px;background:#e9f6ff;border-radius:16px;padding:8px}.wsq{font-size:20px;margin-bottom:6px}
.wfoot{flex-wrap:wrap;justify-content:center;gap:8px}.wfoot .btn{min-width:110px}
.whcard{background:linear-gradient(135deg,#fff3d6,#f0e9ff)}
.whmode{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.whmode .btn{flex:1;min-width:150px;background:#fff;color:#26214f;border:3px solid #e1dcf7}.whmode .btn.on{background:#7c4dff;color:#fff;border-color:#7c4dff}
.whv{background:var(--c)!important;color:#fff!important}.whv span{font-size:44px;font-weight:800;line-height:1}.whv small{color:#fff;opacity:.95}
@media (max-height:900px) and (orientation:landscape){.wword{font-size:50px}.wemoji{font-size:44px}.wsvgbox{flex-basis:330px;width:min(330px,52vw)}.wclue{font-size:16px;padding:6px 8px}.wpanel{padding:8px 10px}}
@media (orientation:portrait){.wsvgbox{width:min(520px,90vw);flex-basis:100%}.wpanel{max-width:520px}}
/* ---- v10: personas & welcome ---- */
.pimg{display:block;height:auto;max-width:100%;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}.pemo{font-size:56px;line-height:1}
.welcard{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px auto;max-width:640px}
.welpic{position:relative;width:min(260px,52vw);display:flex;justify-content:center;align-items:flex-end;padding:12px 10px 0;border-radius:36px;background:radial-gradient(circle at 50% 70%,var(--b),#fff 80%);border:5px solid var(--c);box-shadow:0 6px 0 rgba(0,0,0,.12);animation:welfloat 3.2s ease-in-out infinite}
.welimg{height:min(300px,34vh)}.welbadge{position:absolute;right:-14px;top:-14px;font-size:38px;background:#fff;border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
@keyframes welfloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.weltag{display:inline-block;background:#fff;border-radius:99px;padding:4px 16px;font-weight:800;color:#6b3fd6;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.1)}.welline{font-size:26px;font-weight:700;color:#26214f;margin-top:8px;line-height:1.25}.weltxt{text-align:center}
.smallbyte{font-size:44px!important;margin:0!important}
@media (max-height:760px){.welimg{height:min(220px,30vh)}.welline{font-size:22px}}
.herop{flex:0 0 auto;position:relative;width:104px;border:4px solid var(--c);border-radius:26px;background:radial-gradient(circle at 50% 70%,var(--b),#fff 85%);padding:6px 4px 0;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;margin-right:10px;transition:transform .15s,box-shadow .15s}
.heroimg{height:104px}.suitlbl{font-size:11px;font-weight:800;color:var(--c);background:#fff;border-radius:99px;padding:1px 8px;margin:2px 0 4px}
@media (hover:hover) and (pointer:fine){.herop:hover{transform:translateY(-3px) rotate(-2deg);box-shadow:0 0 0 4px #ffc833}}
.suitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.suitc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:20px;border:4px solid transparent;background:radial-gradient(circle at 50% 65%,var(--b),#fff 90%);font:inherit;color:#26214f;cursor:pointer;transition:transform .12s,box-shadow .12s}
.suitc.on{border-color:var(--c);box-shadow:0 0 0 4px rgba(255,200,51,.7)}.suitimg{height:120px}.autoe{font-size:70px;line-height:1.5}.suitc small{font-size:12px;color:#7a5aa8;font-weight:700}
@media (hover:hover) and (pointer:fine){.suitc:hover{transform:translateY(-4px);border-color:var(--c)}}
.suitsheet{max-width:760px}
.qavatar{position:absolute;right:10px;top:-34px;width:62px;height:62px;border-radius:50%;border:4px solid var(--c);background:radial-gradient(circle at 50% 70%,var(--b),#fff);overflow:hidden;display:flex;justify-content:center;align-items:flex-start;z-index:2;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.qavatar .qav{width:150%;max-width:none;margin-top:2px}
#s-work .qcard{position:relative}
.gavatar{position:absolute;right:76px;top:10px;width:54px;height:54px;border-radius:50%;border:4px solid var(--c);background:radial-gradient(circle at 50% 70%,var(--b),#fff);overflow:hidden;z-index:5;display:flex;justify-content:center}.gavatar .qav{width:150%;max-width:none;margin-top:2px}
#s-game{position:relative}
.labhero{display:flex;align-items:flex-end;gap:12px;background:radial-gradient(circle at 12% 60%,var(--b),#fff 70%);border:3px solid var(--c);border-radius:24px;padding:6px 14px 0;margin-bottom:10px;overflow:hidden}.labimg{height:96px;margin-bottom:-4px}
.doneav{display:flex;justify-content:center;margin-bottom:-6px}.doneimg{height:130px;animation:welfloat 3s ease-in-out infinite}
.celav{display:flex;justify-content:center}.celimg{height:120px;animation:blkpop .5s}
.wkhead{display:flex;align-items:flex-end;gap:6px;background:linear-gradient(135deg,var(--b),#fff);border:3px solid var(--c);overflow:hidden;padding-bottom:0}.wkimg{height:110px}.wkimg2{height:84px}.wkhead>div{align-self:center;margin-left:8px}
@media print{.wkhead{break-inside:avoid}}
/* ---- v10b: English adventures ---- */
.cecard{background:linear-gradient(135deg,#e8f4ff,#fff0f6)}
.dtab{border-collapse:collapse;margin:6px auto;font-size:18px}.dtab th{background:#e9e1ff;padding:4px 14px;border-radius:8px}.dtab td{padding:6px 14px;text-align:center;font-weight:700;border-bottom:3px dotted #cfc8f0}
.pcwrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.pcform{flex:1 1 360px;min-width:300px}.pcrow{margin-bottom:8px}.pcl{font-weight:800;color:#6b3fd6;margin-bottom:2px}.pcchips{display:flex;flex-wrap:wrap;gap:6px}.pcchips .mchip{min-height:44px;font-size:16px;padding:6px 12px}
.pcard{flex:1 1 300px;min-width:260px;max-width:420px;position:relative;background:#fffdf4;border:3px dashed #d9a441;border-radius:14px;padding:14px 14px 10px;min-height:230px;transition:transform .9s ease-in,opacity .9s}
.pcard.fly{transform:translate(300px,-260px) rotate(18deg) scale(.3);opacity:0}
.pcstamp{position:absolute;right:10px;top:8px;text-align:center;border:2px solid #d9a441;border-radius:6px;padding:2px 8px;font-size:30px;line-height:1.1;background:#fff}.pcstamp small{font-size:10px;color:#a8741a}
.pcmsg{margin-top:36px;font-size:21px;font-weight:600;line-height:1.5}.pcline{margin:2px 0}.pcaddr{margin-top:10px;text-align:right;font-size:14px;color:#7a5aa8;font-weight:700;border-top:2px solid #eadfc0;padding-top:6px}
.qavatar{right:78px;top:-30px;width:56px;height:56px}
.herop .suitlbl{white-space:nowrap;font-size:10px}
</style>

  r.fresh(pool,6).forEach(function(w){
    var W=w[0].toUpperCase(),ok=false,t,d,sr,sc,k,er,ec,fit,g;

function exportBackup(){
  var data=JSON.stringify({app:'it-geek-academy',v:2,at:new Date().toISOString(),state:S}),name='geek-academy-backup-'+todayStr()+'.json';
  S.lastBackup=Date.now();save();
  try{
    var blob=new Blob([data],{type:'application/json'}),f=null;try{f=new File([blob],name,{type:'application/json'});}catch(e){}
    if(navigator.canShare&&f&&navigator.canShare({files:[f]})&&navigator.share){navigator.share({files:[f],title:'IT Geek Academy backup'}).catch(function(){});return;}
    var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){try{document.body.removeChild(a);URL.revokeObjectURL(u);}catch(e){}},4000);
  }catch(e){try{window.open('data:application/json;charset=utf-8,'+encodeURIComponent(data));}catch(x){toast('Could not create the backup');}}

  fr.onload=function(){
    var o=null;try{o=JSON.parse(fr.result);}catch(e){}
    if(!validBackup(o)){alert('That file is not an IT Geek Academy backup.');return;}
    var n=(o.state.custom||[]).length,xp=o.state.xp||0;
    if(!confirm('Restore this backup?\n\nSaved: '+(o.at||'unknown date').slice(0,10)+'\nXP: '+xp+' · Custom questions: '+n+'\n\nThis replaces the progress on this device.'))return;
    try{try{localStorage.setItem(KEY+'_before_restore',localStorage.getItem(KEY)||'');}catch(e){}localStorage.setItem(KEY,JSON.stringify(o.state));location.reload();}catch(e){alert('Could not restore: storage is full or blocked.');}
  };
  try{fr.readAsText(file);}catch(e){toast('Could not read that file');}
}
function backupAge(){if(!S.lastBackup)return null;return Math.floor((Date.now()-S.lastBackup)/864e5);}

const VOX={voices:[],ready:false,rate:.95,pitch:1.1,keep:[]};
const VOICE_GOOD={ava:40,samantha:38,zoe:36,allison:34,evan:30,nicky:32,tessa:30,veena:30,karen:28,moira:28,serena:26,susan:24,fiona:24,kate:24,daniel:22,rishi:22,aaron:20,siri:18};

function voiceScore(v){
  try{
    var n=String(v.name||'').toLowerCase(),l=String(v.lang||'').toLowerCase().replace('_','-'),sc=0;
    if(l.indexOf('en')!==0)return -1;
    if(VOICE_BAD.test(n))return -50;

    if(/google|online/.test(n))sc+=30;
    Object.keys(VOICE_GOOD).forEach(function(k){if(n.indexOf(k)>=0)sc+=VOICE_GOOD[k];});
    if(/compact/.test(n))sc-=15;
    if(v.localService)sc+=8;

  }catch(e){return -1;}
}

/* say(text, force, {rate,pitch,onend}) : speaks sentence by sentence with a little expression */
function say(t,force,o){
  if((!S.setup.speak&&!force)||!('speechSynthesis' in window)||!t)return;
  o=o||{};
  var finished=false,done=function(){if(finished)return;finished=true;if(o.onend){try{o.onend();}catch(e){}}};
  try{
    var go1=function(){
      try{
        var v=pickVoice(),text=String(t).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),parts=text.match(/[^.!?…]+[.!?…]*/g)||[text],k=0;
        VOX.keep=[];
        parts.forEach(function(p,i){
          p=p.trim();if(!p)return;
          var u=new SpeechSynthesisUtterance(p),last=(i===parts.length-1),q=/\?$/.test(p),ex=/!$/.test(p);
          u.rate=Math.max(.5,Math.min(1.4,(o.rate||VOX.rate)*(ex?1.03:1)));
          u.pitch=Math.max(.5,Math.min(1.8,(o.pitch||VOX.pitch)+(ex?.08:q?.12:0)));
          u.volume=1;

          if(!k&&o.onstart)u.onstart=function(){try{o.onstart();}catch(e){}};
          if(last){u.onend=done;u.onerror=done;}
          VOX.keep.push(u);k++;speechSynthesis.speak(u);         /* keep references: iOS drops finished-event of collected utterances */
        });

const VNUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten'};
function normWords(s){
  s=String(s||'').toLowerCase().replace(/wi[\s-]?fi|why[\s-]?fi/g,'wifi').replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ');
  return s.split(/\s+/).filter(Boolean).map(function(w){if(VNUMW[w])w=VNUMW[w];if(w==='color')w='colour';if(w==='colors')w='colours';return w;});
}
function lev1(a,b){
  if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;
  var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}
  return d+(a.length-i)+(b.length-j)<=1;
}
function sameWord(a,b){
  if(a===b)return true;
  var sa=a.replace(/s$/,''),sb=b.replace(/s$/,'');if(sa===sb&&sa.length>=3)return true;
  return a.length>=5&&b.length>=5&&lev1(a,b);
}
/* LCS-style alignment so word order counts; returns which target words were heard */
function matchSentence(target,heard){
  var T=normWords(target),H=normWords(heard),n=T.length,m=H.length,i,j,L=[];
  for(i=0;i<=n;i++){L.push([]);for(j=0;j<=m;j++)L[i].push(0);}
  for(i=1;i<=n;i++)for(j=1;j<=m;j++)L[i][j]=sameWord(T[i-1],H[j-1])?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
  var ok=new Array(n).fill(false);i=n;j=m;
  while(i>0&&j>0){if(sameWord(T[i-1],H[j-1])&&L[i][j]===L[i-1][j-1]+1){ok[i-1]=true;i--;j--;}else if(L[i-1][j]>=L[i][j-1])i--;else j--;}
  var got=ok.filter(Boolean).length,need=Math.max(1,Math.ceil(n*.75));
  return {words:T,ok:ok,got:got,need:need,pass:m>0&&got>=need,heard:H.join(' '),score:n?got/n:0};
}

function alarmShouldFire(now){
  var a=alarmState(),t=Date.now();

  var idle=t-ALM.act;

  for(k=0;k<S.length;k++){var ex=[];for(i=0;i<n;i++)if(L[i]&&(labels[i]===S[k]||L[i]===SA[k]))ex.push(i);if(ex.length===1)return ex[0];}

  var sc=[];
  for(i=0;i<n;i++){
    var T=normWords(L[i]),top=0;if(!T.length||L[i].length<2){sc.push(0);continue;}
    for(k=0;k<SA.length;k++){

      var v=r.pass?(ex2+(r.got-ex2)*.5)/T.length+.01:0;if(v>top)top=v;
    }

  }

  var ord={one:0,'1':0,first:0,two:1,'2':1,second:1,three:2,'3':2,third:2,four:3,'4':3,fourth:3};

  return -1;
}

const DXY=[[0,-1],[1,0],[0,1],[-1,0]];
function bbSim(w,h,st,cmds){
  var x=st.x,y=st.y,d=st.d,trail=[[x,y,d,false]];
  cmds.forEach(function(c){
    var bump=false;

    else if(c==='F'||c==='B'){var s=c==='F'?1:-1,nx=x+DXY[d][0]*s,ny=y+DXY[d][1]*s;if(nx<0||ny<0||nx>=w||ny>=h)bump=true;else{x=nx;y=ny;}}
    trail.push([x,y,d,bump]);
  });
  return {x:x,y:y,d:d,trail:trail,bumped:trail.some(function(t){return t[3];})};
}
function bbSolve(w,h,st,goal){
  var seen={},qu=[[st.x,st.y,st.d,[]]],k;
  while(qu.length){
    var s=qu.shift();k=s[0]+','+s[1]+','+s[2];if(seen[k])continue;seen[k]=1;
    if(s[0]===goal.x&&s[1]===goal.y)return s[3];
    if(s[3].length>=12)continue;
    ['F','L','R','B'].forEach(function(c){var m=bbSim(w,h,{x:s[0],y:s[1],d:s[2]},[c]);if(m.bumped)return;qu.push([m.x,m.y,m.d,s[3].concat(c)]);});
  }
  return null;
}

  else gens=['train','diary','park','prt','trainord','tf','tab','post'];
  var v=pk(r,gens),q;

  else if(v==='adj'){var a=pk(r,CE_ADJ),ws=pickN(r,['big','shiny','noisy','heavy','red','new'].filter(function(x){return x!==a[1];}),2);q=ceCh(r,{topic:'English: Describing words',prompt:'Pick a good describing word: a ___ <b>'+a[0]+'</b>',say:'Pick a good describing word for the '+a[0],visual:ceBig('🖍️'),answer:a[1],wrongs:ws,hint:'Describing words tell us what something is like.',after:'a <b>'+a[1]+'</b> '+a[0]});}

  else if(v==='real'){var rp=pk(r,[['A scarf can fly to the moon.','pretend'],['A scarf keeps you warm.','real'],['A cat can talk to an owl.','pretend'],['An owl can fly at night.','real'],['A fox can wear shoes and drive a car.','pretend'],['A chick says peep.','real']]);q=ceCh(r,{topic:'English: Real or pretend',prompt:'Is it <b>real</b> or <b>pretend</b>?<br><span style="font-weight:600">'+esc(rp[0])+'</span>',say:'Is this real or pretend? '+rp[0],visual:ceBig('🧚'),answer:rp[1],wrongs:[rp[1]==='real'?'pretend':'real'],n:1,hint:'Real things can happen. Pretend things are for stories!',after:'It is <b>'+rp[1]+'</b>.',cols:2});}
  else if(v==='prt'){var pr=pk(r,CE_PRET),wr=pickN(r,CE_PRET.filter(function(x){return x!==pr;}),2);q=ceCh(r,{topic:'English: Past tense',prompt:'Change it to the <b>past</b> (yesterday)',say:'Change it to yesterday. '+pr[0],visual:'<div class="sentbox">'+esc(pr[0])+'</div>',answer:pr[1],wrongs:[pr[0],wr[0][0].replace(/walk|buy|see|come|jump|play/,'')].slice(0,1).concat([wr[0][1]]).slice(0,2),hint:'Yesterday it already happened. Add -ed, or use a new word like saw, went, bought.',after:'<b>'+esc(pr[1])+'</b>',cols:1});}
  else if(v==='trainord'){q=ceOrd({topic:'English: Recount order',prompt:'Put my train trip in order',visual:ceBig('🚆'),tiles:CE_TRAIN,sol:CE_TRAIN,hint:'First you need a ticket!',after:'<b>Ticket → platform → train → Grandpa</b>',sentence:CE_TRAIN.join(', ').replace(/[^\x00-\x7F]/g,'')});}
  else if(v==='tab'){var ds=[['Monday','the park','played'],['Tuesday','the zoo','saw a lion'],['Wednesday','Gran\'s house','ate cake'],['Thursday','the beach','built a sandcastle']],d=pk(r,ds),k=r.int(0,2);q=ceCh(r,{topic:'English: Diary table',prompt:['<b>When?</b> I went to '+d[1]+' on ___.','<b>Where?</b> On '+d[0]+' I went to ___.','<b>What?</b> On '+d[0]+' at '+d[1]+' I ___.'][k],say:['When did I go to '+d[1]+'?','Where did I go on '+d[0]+'?','What did I do at '+d[1]+'?'][k],visual:'<table class="dtab"><tr><th>When?</th><th>Where?</th><th>What?</th></tr><tr><td>'+d[0]+'</td><td>'+d[1]+'</td><td>I '+d[2]+'</td></tr></table>',answer:[d[0],d[1],'played'===d[2]?'played':d[2]][k],wrongs:pickN(r,ds.map(function(x){return [x[0],x[1],x[2]][k];}).filter(function(x){return x!==[d[0],d[1],d[2]][k];}),2),hint:'Look at the table. When? Where? What?',after:'Table: <b>'+d[0]+' · '+d[1]+' · '+d[2]+'</b>'});q.answer=[d[0],d[1],d[2]][k];q.options=r.shuffle([q.answer].concat(pickN(r,ds.map(function(x){return x[k];}).filter(function(x){return x!==q.answer;}),2)).map(cOpt));}
  else{var pc=pk(r,CE_PC);q=ceCh(r,{topic:'English: Postcards',prompt:pc[1],say:pc[1],visual:ceBig('💌'),answer:pc[0],wrongs:pickN(r,CE_PC.map(function(x){return x[0];}).filter(function(x){return x!==pc[0];}),2),hint:'Dear…, message, See you soon!, P.S.',after:'<b>'+pc[0]+'</b>'});}
  return q;
}

var CE_FEEL=[['angry','😠'],['sad','😢'],['happy','😀'],['sleepy','😴'],['scared','😨'],['excited','🤩'],['proud','😌'],['cold','🥶']];
var CE_AAN=[['___ apple','an'],['___ elephant','an'],['___ dragon','a'],['___ castle','a'],['___ egg','an'],['___ unicorn','a'],['___ orange','an'],['___ wizard','a']];
var CE_BEC=[['Fish can swim ___ they have fins.','because'],['I wear a coat ___ it is cold.','because'],['Birds can fly ___ they have wings.','because'],['We use an umbrella ___ it is raining.','because']];
var CE_WEA=[['sun','☀️','The ___ is hot and bright.'],['rain','🌧️','The ___ goes drip, drop, drop.'],['wind','💨','The ___ blows my kite.'],['snow','❄️','The ___ is soft and cold.'],['cloud','☁️','A fluffy ___ floats by.']];
var CE_INS=[['Wash your hands','Dry your hands','Eat your lunch'],['Take the bread','Add the cheese','Close the sandwich'],['Pour the milk','Add the cereal','Eat with a spoon'],['Open the book','Look at the pictures','Read the words']];
function ceX(r){
  var v=r.pick(['feel','aan','bec','wea','ins','sign']),q;
  if(v==='feel'){var f=pk(r,CE_FEEL);q=ceCh(r,{topic:'English: Feelings A–Z',prompt:'How does this face feel? It starts with <b>'+f[0].charAt(0)+'</b>.',say:'How does this face feel? The word starts with '+f[0].charAt(0)+'.',visual:ceBig(f[1]),answer:f[0],wrongs:pickN(r,CE_FEEL.filter(function(x){return x!==f;}),2).map(function(x){return x[0];}),hint:'Look at the face. The first letter helps!',after:'<b>'+f[0]+'</b> '+f[1]});}
  else if(v==='aan'){var a=pk(r,CE_AAN);q=ceCh(r,{topic:'English: a or an',prompt:'<b>a</b> or <b>an</b>?',say:'Is it a or an? '+a[0].replace('___','blank'),visual:'<div class="sentbox">'+blankHtml(a[0])+'</div>',answer:a[1],wrongs:[a[1]==='a'?'an':'a'],n:1,hint:'Use "an" before the vowel sounds a, e, i, o, u.',after:'<b>'+a[1]+'</b> '+a[0].replace('___ ',''),cols:2});}
  else if(v==='bec'){var b=pk(r,CE_BEC);q=ceCh(r,{topic:'English: because',prompt:'Pick the word that gives a reason',say:'Pick the word that gives a reason. '+b[0].replace('___','blank'),visual:'<div class="sentbox">'+blankHtml(b[0])+'</div>',answer:'because',wrongs:['and','then'],hint:'"because" tells us why.',after:b[0].replace('___','<b>because</b>')});}
  else if(v==='wea'){var w=pk(r,CE_WEA);q=ceCh(r,{topic:'English: Weather poem',prompt:'Finish the weather poem',say:'Finish the weather poem. '+w[2].replace('___','blank'),visual:ceBig(w[1])+'<div class="sentbox">'+blankHtml(w[2])+'</div>',answer:w[0],wrongs:pickN(r,CE_WEA.filter(function(x){return x!==w;}),2).map(function(x){return x[0];}),emoji:objFrom(CE_WEA.map(function(x){return [x[0],x[1]];})),hint:'Look at the picture.',after:w[2].replace('___','<b>'+w[0]+'</b>')});}
  else if(v==='ins'){var s=pk(r,CE_INS);q=ceOrd({topic:'English: Instructions',prompt:'Put the instructions in order',visual:ceBig('🔢'),tiles:s,sol:s,hint:'What do you do first?',after:'<b>1</b> '+esc(s[0])+' <b>2</b> '+esc(s[1])+' <b>3</b> '+esc(s[2]),sentence:s.join('. ')});}
  else{var sg=pk(r,[['🛑','STOP','stop'],['🚫','NO ENTRY','not go in'],['🚭','NO SMOKING','not smoke'],['⚠️','CAREFUL','be careful'],['🚸','CHILDREN','look out for children']]);q=ceCh(r,{topic:'English: Signs',prompt:'What does this sign tell us?',say:'What does this sign tell us?',visual:ceBig(sg[0]),answer:sg[2],wrongs:pickN(r,['stop','be careful','not go in','run fast','sit down','look out for children'].filter(function(x){return x!==sg[2];}),2),hint:'Signs give short, important instructions.',after:'<b>'+sg[1]+'</b> means '+sg[2]+'.'});}
  return q;
}
/* ---------- Postcard Creator ---------- */
var PC_TO=['Mom','Dad','Grandpa','Zara','Byte'],PC_MSG=['I am at the zoo.','I saw a big lion.','The sun is hot.','I ate ice cream.','I can see the sea.','We went on a train.'],PC_END=['See you soon!','Love from','Bye for now!'],PC_PS=['P.S. I miss you!','P.S. Look at the stamp!','P.S. Give Fluff a hug!'];
function postcardUI(q,host,api){
  var sel={to:null,msg:[],end:null,ps:null};
  var root=el('<div class="pcwrap"></div>'),form=el('<div class="pcform"></div>'),card=el('<div class="pcard hlbox"></div>');
  function chips(label,key,list,multi){
    var w=el('<div class="pcrow"><div class="pcl">'+label+'</div><div class="pcchips"></div></div>'),c=w.querySelector('.pcchips');
    list.forEach(function(t){var b=el('<button type="button" class="mchip"><span class="nb"></span>'+esc(t)+'</button>');b.addEventListener('click',function(){
      if(QS.done)return;SFX.pop();
      if(multi){var i=sel.msg.indexOf(t);if(i>=0)sel.msg.splice(i,1);else if(sel.msg.length<2)sel.msg.push(t);}else sel[key]=(sel[key]===t&&key==='ps')?null:t;
      [].forEach.call(c.children,function(x){var tx=x.textContent;x.classList.toggle('on',multi?sel.msg.indexOf(tx)>=0:sel[key]===tx);});paint();});c.appendChild(b);});
    form.appendChild(w);
  }
  chips('1️⃣ Who is it for?','to',PC_TO.map(function(x){return 'Dear '+x+',';}));
  chips('2️⃣ Write 1–2 sentences','msg',PC_MSG,true);
  chips('3️⃣ Say goodbye','end',PC_END);
  chips('4️⃣ Add a P.S. (optional)','ps',PC_PS);
  var foot=el('<div class="dzfoot"></div>'),send=el('<button type="button" class="btn ok" disabled>✉️ Send my postcard!</button>'),hear=el('<button type="button" class="btn ghost sm">🔊 Read it to me</button>');foot.appendChild(send);foot.appendChild(hear);
  root.appendChild(form);root.appendChild(card);root.appendChild(foot);host.appendChild(root);
  function text(){return [sel.to||'Dear …',sel.msg.join(' ')||'…',(sel.end||'…')+(sel.end==='Love from'?' Rudraksh':sel.end?' Rudraksh':''),sel.ps||''].filter(Boolean);}
  function paint(){
    var t=text();card.innerHTML='<div class="pcstamp">🏷️<br><small>stamp</small></div><div class="pcmsg">'+t.map(function(l,i){return '<div class="pcline">'+rdWords(l)+'</div>';}).join('')+'</div><div class="pcaddr">📮 Rudraksh<br>Pune, India</div>';
    send.disabled=!(sel.to&&sel.msg.length&&sel.end);
  }
  hear.addEventListener('click',function(){ac();hlRead(card.querySelector('.pcmsg'));});
  send.addEventListener('click',function(){
    if(QS.done||send.disabled)return;if(!S.postcards)S.postcards=[];S.postcards.unshift({d:todayStr(),t:text()});S.postcards=S.postcards.slice(0,20);save();
    card.classList.add('fly');SFX.win();party(false);say('Your postcard is on its way!',true);setTimeout(function(){api.right();},900);
  });
  setKeys(function(e){if(e.key==='Enter'&&!send.disabled&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){send.click();return true;}return false;});
  CL.push(function(){hlStop();});
  paint();
  return {hint:function(){fb('info','💡 Pick Dear…, then one or two sentences, then a goodbye!');},reveal:function(){sel={to:'Dear Mom,',msg:[PC_MSG[0]],end:PC_END[0],ps:null};paint();send.disabled=false;}};
}

function startCE(id,origin){
