<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rudraksh's IT Geek Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT Geek">
<meta name="theme-color" content="#7c4dff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--ink:#26214f;--soft:#6b66a3;--eng:#ff5c8a;--mth:#3d8bff;--cs:#7c4dff;--ok:#2fbf71;--bad:#ff6b57;--sun:#ffc833;--glass:rgba(255,255,255,.82);--r:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;font-family:'Fredoka',ui-rounded,-apple-system,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:radial-gradient(circle at 15% 10%,#ffd9ec 0,transparent 45%),radial-gradient(circle at 90% 20%,#cfe3ff 0,transparent 45%),radial-gradient(circle at 50% 100%,#e2d6ff 0,transparent 55%),#f4f0ff;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,h4{margin:.2em 0}
b{font-weight:700}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 22px 26px;display:none}
.screen.active{display:block;animation:pop .35s ease}
.wrap{max-width:900px;margin:0 auto}
.center{text-align:center}
.sub{color:var(--soft);font-size:20px;margin:.3em 0 1em}
small{color:var(--soft)}
#tabs{display:flex;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid rgba(124,77,255,.15);box-shadow:0 -6px 24px rgba(80,60,160,.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--soft)}
.tab i{font-style:normal;font-size:30px;line-height:1.1;transition:transform .2s}
.tab.on{color:var(--cs)}
.tab.on i{transform:scale(1.2) translateY(-2px)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:var(--r);padding:20px;margin:0 0 16px;box-shadow:0 8px 28px rgba(80,60,160,.12);border:1px solid rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;border-radius:22px;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f5bff,#5a8bff);box-shadow:0 8px 18px rgba(100,80,220,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.big{min-height:72px;font-size:26px;padding:0 40px}
.btn.ok{background:linear-gradient(135deg,#34c77b,#1fa3a3);box-shadow:0 8px 18px rgba(30,160,120,.35)}
.btn.warn{background:linear-gradient(135deg,#ff8a5c,#ff5c8a);box-shadow:0 8px 18px rgba(255,92,120,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(80,60,160,.15)}
.btn[disabled]{opacity:.4;box-shadow:none}
.btn.sm{min-height:46px;font-size:17px;padding:0 18px;border-radius:16px}
.icon{width:54px;height:54px;border-radius:18px;background:#fff;font-size:24px;box-shadow:0 4px 12px rgba(80,60,160,.15);flex:none}
button#vClose{color:#26214f}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:600;font-size:16px;background:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center}
.row>*{margin:6px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,51,.9)}50%{box-shadow:0 0 0 12px rgba(255,200,51,0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(6deg)}}
@keyframes scanl{0%{top:6%}100%{top:90%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* splash */
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.byte{font-size:150px;line-height:1;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(80,60,160,.3))}
.title{font-size:54px;margin:.1em 0;background:linear-gradient(90deg,#ff5c8a,#7c4dff,#3d8bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.floaty{position:absolute;font-size:54px;animation:floaty 5s ease-in-out infinite;opacity:.85}
.floaty.f1{left:10%;top:12%}.floaty.f2{right:12%;top:16%;animation-delay:.8s}.floaty.f3{left:14%;bottom:16%;animation-delay:1.6s}.floaty.f4{right:16%;bottom:20%;animation-delay:2.4s}.floaty.f5{left:46%;top:6%;animation-delay:3s}
/* home */
.hero{display:flex;align-items:center}
.hero .byte{font-size:92px;animation-duration:2.6s}
.bubble{background:#fff;border-radius:24px 24px 24px 6px;padding:14px 20px;font-size:21px;margin-left:12px;box-shadow:0 6px 18px rgba(80,60,160,.12)}
.stats{display:flex;flex-wrap:wrap;margin:0 -6px 6px}
.stat{flex:1;min-width:150px;margin:6px;padding:14px 16px;border-radius:22px;background:var(--glass);box-shadow:0 6px 18px rgba(80,60,160,.1);text-align:center}
.stat b{font-size:30px;display:block}
.bar{height:14px;border-radius:99px;background:rgba(124,77,255,.15);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc833,#ff5c8a);border-radius:99px;transition:width .6s}
.todayc{background:linear-gradient(135deg,#7c4dff,#3d8bff);color:#fff}
.todayc .sub{color:#e8e2ff}
.doms{display:flex;flex-wrap:wrap;margin:10px -5px 0}
.dchip{flex:1;min-width:130px;margin:5px;padding:12px;border-radius:18px;background:rgba(255,255,255,.2);text-align:center;font-weight:600;font-size:18px}
.badges{display:flex;flex-wrap:wrap}
.bdg{font-size:38px;margin:4px 10px 4px 0;filter:grayscale(1);opacity:.35}
.bdg.on{filter:none;opacity:1}
/* worksheet */
.wtop{display:flex;align-items:center;margin-bottom:10px}
.wtop>*{margin-right:10px}
.pillD{padding:8px 16px;border-radius:99px;color:#fff;font-weight:700;font-size:18px;white-space:nowrap}
.dots{flex:1;display:flex;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(38,33,79,.15);margin:3px}
.dot.ok{background:var(--ok)}.dot.no{background:var(--sun)}.dot.cur{outline:3px solid var(--cs);outline-offset:2px}
.qcard{background:var(--glass);border-radius:30px;padding:22px;box-shadow:0 10px 30px rgba(80,60,160,.14)}
.qprompt{font-size:29px;font-weight:600;text-align:center;line-height:1.25}
.qvis{margin:12px 0;text-align:center}
.bigemoji{font-size:90px;line-height:1.1}
.svgi{width:96px;height:96px}
.sent{font-size:34px;font-weight:600;margin:6px 0}
.blank{display:inline-block;min-width:90px;border-bottom:5px solid var(--cs);color:var(--cs);text-align:center;margin:0 6px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:14px;margin-top:10px}
.opts.c1{grid-template-columns:1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{min-height:92px;border-radius:24px;background:#fff;font-size:36px;font-weight:700;padding:10px;border:4px solid transparent;box-shadow:0 6px 16px rgba(80,60,160,.14);transition:transform .12s,background .2s}
.opt:active{transform:scale(.96)}
.opt .em{font-size:60px;display:block;line-height:1.1}
.opt .nm{font-size:22px;display:block}
.opt .svgi{width:68px;height:68px}
.opt.ok{background:#d6f8e5;border-color:var(--ok);animation:bounce .5s}
.opt.bad{background:#ffe1dc;border-color:var(--bad);animation:shake .4s}
.opt.dim{opacity:.35;pointer-events:none}
.fb{min-height:54px;margin-top:12px;border-radius:18px;padding:10px 16px;font-size:21px;font-weight:600;text-align:center;display:none}
.fb.show{display:block;animation:fadeUp .25s}
.fb.ok{background:#d6f8e5;color:#127a47}.fb.bad{background:#ffe9e4;color:#b8412f}.fb.info{background:#e8e2ff;color:#4a3bb0}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.emojirow{font-size:44px;line-height:1.25;max-width:640px;margin:0 auto}
.emojirow .g{display:inline-block;margin:4px 12px;white-space:nowrap}
.emojirow .out{opacity:.25;position:relative}
.emojirow .out:after{content:'\274C';position:absolute;left:4px;top:4px;font-size:30px;opacity:1}
.lineup{font-size:60px;white-space:nowrap}.lineup small{font-size:20px}
.seq{display:flex;justify-content:center;flex-wrap:wrap}
.sb{min-width:76px;height:76px;margin:5px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;box-shadow:0 4px 12px rgba(80,60,160,.14)}
.sb.q{background:#fff6cf;border:4px dashed var(--sun);color:var(--sun)}
.numcard{font-size:64px}
.eq{font-size:58px;font-weight:700;margin-top:6px}
.passage{background:#fffdf3;border:3px dashed #ffd978;border-radius:22px;padding:14px 20px;text-align:left;font-size:25px;line-height:1.5;max-width:700px;margin:0 auto}
.passage h4{font-size:24px;color:var(--eng)}
.sayb{margin-top:6px;background:#fff;padding:8px 16px;border-radius:14px;font-size:18px;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.scene{position:relative;width:270px;height:190px;margin:0 auto}
.scene.mini{transform:scale(.55);margin:-40px -40px -34px}
.scene span{position:absolute;line-height:1;transform:translate(-50%,-50%)}
.sc-in .L{left:50%;top:60%;font-size:120px;z-index:2}.sc-in .S{left:50%;top:32%;font-size:64px;z-index:1}
.sc-on .L{left:50%;top:70%;font-size:110px}.sc-on .S{left:50%;top:24%;font-size:72px}
.sc-under .L{left:50%;top:28%;font-size:110px}.sc-under .S{left:50%;top:80%;font-size:60px}
.sc-behind .L{left:38%;top:55%;font-size:120px;z-index:2}.sc-behind .S{left:62%;top:58%;font-size:80px;z-index:1}
.sc-nextto .L{left:26%;top:55%;font-size:100px}.sc-nextto .S{left:74%;top:60%;font-size:80px}
/* grid */
.gridq{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;width:330px;margin:10px auto}
.gcell{height:96px;border-radius:18px;background:#fff;font-size:52px;box-shadow:0 4px 10px rgba(80,60,160,.14);border:4px solid transparent}
.gcell.ok{background:#d6f8e5;border-color:var(--ok)}.gcell.bad{background:#ffe1dc;animation:shake .4s}
/* keyboard */
.kb{background:#3a3566;border-radius:22px;padding:10px 8px 4px;margin:12px auto 0;max-width:860px}
.kr{display:flex;justify-content:center;margin-bottom:7px}
.k{position:relative;flex:1;min-width:0;height:62px;margin:0 3px;border-radius:12px;font-size:24px;font-weight:700;color:var(--ink);border-bottom:4px solid rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.k:active{transform:translateY(3px);border-bottom-width:1px}
.k.bump:after{content:'';position:absolute;bottom:7px;width:16px;height:4px;border-radius:2px;background:rgba(38,33,79,.5)}
.k.sp{font-size:15px;flex:1.7}.k.sp-SPACE{flex:7;font-size:18px}.k.sp-BACK{flex:1.9}.k.sp-SHIFT{flex:2}.k.sp-ENTER{flex:2.2}
.f0{background:#ffb3cc}.f1{background:#ffcc99}.f2{background:#fff0a0}.f3{background:#b5f0c0}.f4{background:#aeeaf5}.f5{background:#b9c8ff}.f6{background:#d8bcff}.f7{background:#f3b8f0}.f8{background:#e3e1f7}
.k.hint{animation:pulse 1s infinite;transform:scale(1.08);z-index:2}
.k.ok{background:var(--ok);color:#fff}.k.no{animation:shake .35s;background:var(--bad);color:#fff}
.tcopy{font-size:54px;font-weight:700;letter-spacing:8px;color:var(--cs)}
.tbox{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tbox.long .tb{width:42px;height:56px;font-size:30px;margin:0 3px 6px}.tbox.long .tb.sp{width:22px}
.tb{width:56px;height:68px;margin:0 5px;border-radius:14px;background:#fff;border-bottom:6px solid #c9c4ee;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tb.sp{width:34px}
.tb.cur{border-color:var(--sun);animation:pulse 1.2s infinite}.tb.done{background:#d6f8e5;border-color:var(--ok);color:#127a47}
/* drag */
.slots{display:grid;grid-gap:12px;margin-bottom:12px}
.slots.s2{grid-template-columns:1fr 1fr}.slots.s1{grid-template-columns:1fr}
.slot{border:4px dashed #b9b3e8;border-radius:22px;background:rgba(255,255,255,.7);padding:10px;text-align:center;min-height:100px}
.slot.over{border-color:var(--sun);background:#fff8dc}
.slot .sl{font-size:48px;line-height:1.1;font-weight:700}
.slot .sl .svgi{width:70px;height:70px}
.slot .sl small{font-size:17px;font-weight:600;display:block}
.drop{min-height:62px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.slots.s1 .slot{display:flex;align-items:center}.slots.s1 .slot .sl{flex:none;margin-right:16px;min-width:120px}.slots.s1 .slot .drop{flex:1}
.tray{display:flex;flex-wrap:wrap;justify-content:center;min-height:80px;padding:8px;border-radius:20px;background:rgba(124,77,255,.08)}
.chip{display:inline-flex;align-items:center;margin:6px;padding:10px 20px;border-radius:18px;background:#fff;font-size:28px;font-weight:700;box-shadow:0 5px 12px rgba(80,60,160,.2);touch-action:none;-webkit-user-select:none}
.chip .ci{font-size:38px;margin-right:8px}.chip .svgi{width:44px;height:44px;margin-right:8px}
.chip.sel{outline:5px solid var(--sun)}.chip.lock{background:#d6f8e5;pointer-events:none}.chip.ghost{opacity:.25}.chip.no{animation:shake .4s;background:#ffe1dc}
.chip.fly{position:fixed;z-index:999;pointer-events:none;transform:scale(1.12) rotate(-3deg);margin:0}
.dzfoot{text-align:center;margin-top:12px}
/* done */
.trophy{font-size:110px;animation:bounce 1.6s infinite}
.starsRow{display:flex;flex-wrap:wrap;justify-content:center}
.sc{margin:6px;padding:14px 22px;border-radius:22px;color:#fff;font-weight:700;text-align:center;font-size:20px}
.sc b{display:block;font-size:32px;letter-spacing:3px}
.qrCard{text-align:center}
#qrBox{display:inline-block;padding:16px;background:#fff;border-radius:24px;box-shadow:0 8px 22px rgba(80,60,160,.2)}
#qrBox img,#qrBox canvas{display:block}
.lockq{padding:34px 10px;font-size:22px}
.lockq .big{font-size:80px}
/* scan */
.camwrap{position:relative;max-width:560px;min-height:300px;margin:0 auto;border-radius:28px;overflow:hidden;background:#1d1a3d;aspect-ratio:1/1;box-shadow:0 10px 30px rgba(80,60,160,.3)}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .ph{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfcdf5;font-size:22px;text-align:center;padding:20px}
.frame{position:absolute;left:14%;top:14%;right:14%;bottom:14%;border:5px solid rgba(255,255,255,.9);border-radius:26px;display:none}
.frame i{position:absolute;left:6%;right:6%;height:4px;background:var(--sun);box-shadow:0 0 12px var(--sun);animation:scanl 1.8s linear infinite alternate}
.camwrap.live .frame{display:block}.camwrap.live .ph{display:none}
/* lab */
.fact{text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}
.fact .e{font-size:84px}.fact p{font-size:23px;margin:.3em 0}
.steps{display:flex;flex-wrap:wrap;justify-content:center}
.stp{width:150px;margin:8px;padding:12px;border-radius:20px;background:#fff;text-align:center;font-size:17px;box-shadow:0 5px 14px rgba(80,60,160,.12);opacity:0;animation:fadeUp .5s forwards}
.stp i{font-style:normal;font-size:48px;display:block}
.games{display:flex;flex-wrap:wrap}
.game{flex:1;min-width:200px;margin:6px;padding:18px;border-radius:22px;color:#fff;font-weight:700;font-size:21px;text-align:center}
.game i{font-style:normal;font-size:46px;display:block}
/* parent */
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:4px;font-size:17px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field input[type=url],.field select{width:100%;height:54px;border-radius:16px;border:2px solid #d9d4f5;padding:0 14px;font-size:19px;background:#fff;color:var(--ink)}
.chrow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.chrow input[type=text]{flex:1;height:44px;font-size:15px;margin-left:10px;border-radius:12px;border:2px solid #d9d4f5;padding:0 10px}
.chrow input[type=checkbox]{width:28px;height:28px;margin-right:10px}
.note{font-size:16px;padding:12px 16px;border-radius:16px;background:#fff5d6;color:#7a5a00;margin:8px 0}
.good{background:#d6f8e5;color:#127a47}.badn{background:#ffe9e4;color:#b8412f}
/* modal/video/toast */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(38,33,79,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:pop .25s}
.sheet{background:#fff;border-radius:32px;padding:26px;max-width:640px;width:100%;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h2{font-size:30px}
.sheet .big{font-size:92px;text-align:center;line-height:1.1}
.sheet p{font-size:21px;line-height:1.4}
.sheet .row{justify-content:center;margin-top:10px}
#vid{position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;background:#0c0a22;display:none;flex-direction:column}
#vid.on{display:flex}
.vbar{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;color:#fff;font-size:20px;font-weight:600}
.vbar #vTitle{flex:1}.vbar #vTime{margin-right:14px;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:99px;font-size:17px}
.vbox{flex:1;position:relative;min-height:0}
#ytWrap{position:absolute;left:0;top:0;right:0;bottom:0;background:#000}#ytWrap iframe,#ytWrap #ytMount{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
/* shields keep the child inside the app: they cover the YouTube title/share links (top) and logo link (bottom-right) */
.vshield{position:absolute;z-index:2;background:transparent}.vs-top{left:0;right:0;top:0;height:76px}.vs-br{right:0;bottom:0;width:150px;height:58px}
/* message is a banner only: it must never hide YouTube's own play button (iOS needs a real tap on it) */
#vMsg{position:absolute;z-index:3;left:14px;right:14px;top:10px;display:none;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;text-align:center;padding:12px 18px;border-radius:20px;background:rgba(124,77,255,.92);pointer-events:none}
#vStat{display:none;color:#cfcdf5;font-size:14px;padding:0 16px 6px;word-break:break-word}
#vFoot{display:none;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);text-align:center}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:300;background:#26214f;color:#fff;padding:14px 26px;border-radius:99px;font-size:20px;font-weight:600;display:none;max-width:90%;text-align:center}
/* ---- new: games hub, quiz, bonus ---- */
.k,.chip,.gcell,.mc,.bgrid,.memgrid{touch-action:none}

function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

  var a=seed>>>0;

    if(!multi){Object.keys(placed).forEach(function(k){if(placed[k]===tid&&k!==itemId&&!chips[k].classList.contains('lock')){placed[k]=null;tray.appendChild(chips[k]);}else if(placed[k]===tid&&k!==itemId)return;});}
    placed[itemId]=tid;dropOf(tid).appendChild(chips[itemId]);setSel(null);SFX.pop();upd();
  }
  function back(itemId){placed[itemId]=null;tray.appendChild(chips[itemId]);setSel(null);upd();}
  function setSel(id){sel=id;Object.keys(chips).forEach(function(k){chips[k].classList.toggle('sel',k===id);});}
  function upd(){chk.disabled=!q.items.every(function(it){return placed[it.id];});}
  function slotAt(x,y){var e=document.elementFromPoint(x,y);var s=e&&e.closest?e.closest('.slot'):null;return s;}
  q.items.forEach(function(it){
    var c=el('<div class="chip">'+it.html+'</div>');chips[it.id]=c;placed[it.id]=null;tray.appendChild(c);
    c.addEventListener('pointerdown',function(e){
      if(QS.done||c.classList.contains('lock'))return;e.preventDefault();ac();
      var sx=e.clientX,sy=e.clientY,moved=false,fly=null,rect=c.getBoundingClientRect(),ox=sx-rect.left,oy=sy-rect.top,over=null;
      try{c.setPointerCapture(e.pointerId);}catch(x){}
      function mv(ev){
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;
        if(!moved){moved=true;fly=c.cloneNode(true);fly.classList.add('fly');document.body.appendChild(fly);c.classList.add('ghost');}
        fly.style.left=(ev.clientX-ox)+'px';fly.style.top=(ev.clientY-oy)+'px';
        var s=slotAt(ev.clientX,ev.clientY);if(over&&over!==s)over.classList.remove('over');if(s)s.classList.add('over');over=s;
      }
      function up(ev){
        c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
        c.classList.remove('ghost');if(over)over.classList.remove('over');
        if(moved){fly.parentNode.removeChild(fly);var s=slotAt(ev.clientX,ev.clientY);lastDrop=Date.now();if(s)place(it.id,s.getAttribute('data-t'));}
        else{if(placed[it.id])back(it.id);else setSel(sel===it.id?null:it.id);}
      }
      c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
    });
  });
  chk.addEventListener('click',function(){
    if(QS.done)return;var allOk=true;
    q.items.forEach(function(it){
      var c=chips[it.id];if(c.classList.contains('lock'))return;
      if(placed[it.id]===q.map[it.id]){c.classList.add('lock');}
      else{allOk=false;c.classList.add('no');placed[it.id]=null;tray.appendChild(c);setTimeout(function(){c.classList.remove('no');},450);}
    });
    upd();if(allOk)api.right();else api.wrong();
  });
  return {hint:function(){var it=q.items.filter(function(i){return !chips[i.id].classList.contains('lock');})[0];if(it){chips[it.id].classList.add('sel');slotEl[q.map[it.id]].classList.add('over');setTimeout(function(){slotEl[q.map[it.id]].classList.remove('over');},1500);}},
    reveal:function(){q.items.forEach(function(it){placed[it.id]=q.map[it.id];dropOf(q.map[it.id]).appendChild(chips[it.id]);chips[it.id].classList.add('lock');chips[it.id].classList.remove('sel');});chk.disabled=true;}};
}

const DRn=[-1,0,1,0],DCn=[0,1,0,-1],CSYM={F:'↑',L:'↺',R:'↻'};
function gameBot(){
  var body=gameShell('🤖 Code Runner','#34c77b'),set=S.botSet%2,li=0,prog=[],running=false,timer=0,L,pos,dir;
  CL.push(function(){running=false;clearTimeout(timer);});
  body.innerHTML='<div class="qprompt" id="bMsg"></div><div class="bgrid" id="bGrid"></div><div class="prog" id="bProg"></div><div class="center"><button class="btn big cmdb" id="cF" type="button">↑ Forward</button><button class="btn big cmdb" id="cL" type="button">↺ Left</button><button class="btn big cmdb" id="cR" type="button">↻ Right</button></div><div class="row" style="justify-content:center"><button class="btn ok big" id="bRun" type="button">▶ Run</button><button class="btn ghost" id="bUndo" type="button">⌫ Undo</button><button class="btn ghost" id="bClr" type="button">🗑 Clear</button><button class="btn ghost" id="bHint" type="button">💡 Hint</button></div>';
  function msg(h){$('#bMsg').innerHTML=h;}
  function blocked(r,c){if(r<0||r>4||c<0||c>4)return 'the edge';var x=null;L.o.forEach(function(o){if(o[0]===r&&o[1]===c)x=o[2]==='🌲'?'a tree':'a mountain';});return x;}
  function draw(){
    var h='',r,c;
    for(r=0;r<5;r++)for(c=0;c<5;c++){
      var inner='';if(r===L.g[0]&&c===L.g[1])inner='🏢';
      L.o.forEach(function(o){if(o[0]===r&&o[1]===c)inner=o[2];});
      if(r===pos[0]&&c===pos[1])inner+='<div class="bdir" style="transform:rotate('+dir*90+'deg)"></div><span class="rb">🤖</span>';
      h+='<div class="bc'+((r===L.g[0]&&c===L.g[1])?' goal':'')+'">'+inner+'</div>';
    }
    $('#bGrid').innerHTML=h;
  }
  function drawProg(cur){$('#bProg').innerHTML=prog.length?prog.map(function(c,i){return '<span class="pc'+(i===cur?' run':'')+'">'+CSYM[c]+'</span>';}).join(''):'<small>Tap the arrow buttons to build your program ⬇️</small>';}
  function load(){L=BOTLV[set*3+li];pos=L.s.slice();dir=L.d;prog=[];running=false;draw();drawProg(-1);gInfo('Level '+(li+1)+' / 3');msg('Guide the 🤖 to the 🏢!<br><small>Max '+L.max+' commands</small>');}
  function reset(){pos=L.s.slice();dir=L.d;draw();drawProg(-1);}
  function bad(m){running=false;SFX.bad();msg(m);var g=$('#bGrid');g.classList.add('shake');setTimeout(function(){g.classList.remove('shake');},450);timer=setTimeout(reset,1100);}
  function add(c){if(running)return;if(prog.length>=L.max){toast('Program is full! Max '+L.max);return;}prog.push(c);SFX.pop();drawProg(-1);}
  function win(){
    SFX.ok();party(false);li++;
    if(li>=3){S.botSet++;save();resultModal(true,'All 3 levels solved!','You wrote 3 programs. You think like a coder! 💻',gameBot);}
    else{toast('Level complete! ⭐');timer=setTimeout(load,900);}
  }
  function run(){
    if(running||!prog.length)return;
    pos=L.s.slice();dir=L.d;draw();running=true;var i=0;ac();
    (function step(){
      if(!running)return;
      drawProg(i);
      if(i>=prog.length){bad('The program ended, but the 🤖 is not at the 🏢 yet. Fix it and try again! 🔧');return;}
      var c=prog[i];
      if(c==='L')dir=(dir+3)%4;else if(c==='R')dir=(dir+1)%4;

      draw();SFX.key();
      if(pos[0]===L.g[0]&&pos[1]===L.g[1]){running=false;timer=setTimeout(win,500);return;}
      i++;timer=setTimeout(step,650);
    })();
  }
  $('#cF').addEventListener('click',function(){add('F');});$('#cL').addEventListener('click',function(){add('L');});$('#cR').addEventListener('click',function(){add('R');});
  $('#bRun').addEventListener('click',run);

  $('#bHint').addEventListener('click',function(){var s=botSolve(L);toast('💡 The shortest program has '+(s?s.length:'?')+' commands.');});

}

}
function tick(){
  if(!cam.on)return;var v=$('#camV');
  if(v&&v.readyState>=2&&v.videoWidth&&window.jsQR){
    var now=performance.now();
    if(now-cam.last>150){
      cam.last=now;if(!cam.cv)cam.cv=document.createElement('canvas');
      var w=Math.min(520,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);cam.cv.width=w;cam.cv.height=h;
      var cx=cam.cv.getContext('2d');cx.drawImage(v,0,0,w,h);
      var id=cx.getImageData(0,0,w,h),code=jsQR(id.data,w,h,{inversionAttempts:'dontInvert'});
      if(code&&code.data){stopCam();SFX.ok();onScan(code.data);return;}
    }
  }
  cam.raf=requestAnimationFrame(tick);
}
function stopCam(){
  cam.on=false;cancelAnimationFrame(cam.raf);
  if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop();});cam.stream=null;}
  var w=document.getElementById('camw');if(w)w.classList.remove('live');
}
function onScan(text){handlePayload(text);}
function scanPhoto(file){
  if(!file)return;if(!window.jsQR){scanMsg('⚠️ Scanner is still loading. Check Wi-Fi and try again.');return;}
  scanMsg('Reading photo…');var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);var d=x.getImageData(0,0,c.width,c.height),code=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
    if(code&&code.data){SFX.ok();onScan(code.data);}else scanMsg('🤔 I could not find a QR in that photo. Try again, closer and straight on.');
  };im.onerror=function(){scanMsg('Could not open that photo.');};im.src=fr.result;};
  fr.readAsDataURL(file);
}

/* ---------- 9. VIDEO PLAYER (in-app overlay, auto-close) ---------- */
let VID=null,ytCbs=[];
window.onYouTubeIframeAPIReady=function(){ytCbs.splice(0).forEach(function(f){f();});};
function loadYT(cb){
  if(window.YT&&window.YT.Player){cb();return;}ytCbs.push(cb);
  if(!document.getElementById('yt-api')){var s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';s.onerror=function(){if(s.parentNode)s.parentNode.removeChild(s);ytCbs=[];if(VID)failVideo('The YouTube script was blocked or could not be reached (stage: loading script). A content blocker, VPN, Private Relay or parental filter on this device may be blocking youtube.com.');};document.head.appendChild(s);}
}
function vmsg(h){var m=$('#vMsg');m.style.display=h?'flex':'none';m.innerHTML=h||'';}
function playReward(t){
  if(!t)return;ac();
  var ch=CHANNELS.filter(function(c){return c.key===t.ch;})[0]||CHANNELS[0],cid=ch.id,list='UU'+cid.slice(2);
  stopCam();VID={t:t,stage:'loading YouTube script',tries:0,ready:false,player:null,end:Date.now()+Math.max(1,S.setup.maxMin||15)*60000,tick:0,dog:0};
  $('#vid').classList.add('on');$('#vTitle').textContent=ch.e+' '+ch.n;vmsg('<div style="font-size:70px">⏳</div>Getting your video ready…');
  $('#ytWrap').innerHTML='<div id="ytMount"></div>';
  VID.tick=setInterval(function(){var left=Math.max(0,VID.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);$('#vTime').textContent='⏱ '+m+':'+(s<10?'0':'')+s;if(left<=0)endVideo('time');},1000);
  VID.dog=setTimeout(function wd(){if(!VID||VID.ready)return;if(VID.stage==='player ready'&&!VID.waited){VID.waited=1;vmsg('👆 Tap the ▶ play button to start!');VID.dog=setTimeout(wd,60000);return;}failVideo('YouTube did not start (stage: '+VID.stage+'). '+(VID.stage==='player ready'?'The play button was not tapped.':'Check that youtube.com is not blocked on this device (content blocker, VPN, Private Relay).'));},15000);
  loadYT(function(){
    if(!VID)return;VID.stage='creating player';var pv={listType:'playlist',list:list,index:t.idx||0,autoplay:1,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3};
    if(location.protocol.indexOf('http')===0)pv.origin=location.origin;
    try{VID.player=new YT.Player('ytMount',{width:'100%',height:'100%',playerVars:pv,events:{
      onReady:function(e){if(VID)VID.stage='player ready';try{e.target.playVideo();}catch(x){}},
      onStateChange:function(e){if(!VID)return;if(e.data!==1&&e.data!==0&&VID.stage!=='playing')VID.stage='player ready';if(e.data===1){VID.ready=true;VID.stage='playing';vmsg('');}else if(e.data===0){endVideo('done');}},
      onError:function(){if(!VID)return;if(VID.tries<4){VID.tries++;try{VID.player.nextVideo();}catch(x){failVideo('This video cannot play here.');}}else failVideo('These videos cannot play here.');}
    }});}catch(e){failVideo('The video player could not start.');}
  });
}
function failVideo(msg){
  if(!VID)return;var t=VID.t;
  if(!VID.ready&&!t.preview){
    var pool=CHANNELS.filter(function(c){return S.ch[c.key].on&&c.key!==t.ch;});
    t.st='issued';if(pool.length)t.ch=pick(pool).key;S.pending='';save();
  }
  teardownVideo();
  var o=openModal('<div class="big">😕</div><p style="text-align:center">'+esc(msg)+'<br>'+(t.preview?'':'Your reward is safe. Scan it again in a moment!')+'</p><div class="row"><button class="btn" id="vfOk" type="button">OK</button></div>');
  $('#vfOk',o).addEventListener('click',function(){closeModal();go(t.preview?'parent':'home');});
}
function teardownVideo(){
  if(!VID)return;clearInterval(VID.tick);clearTimeout(VID.dog);
  try{if(VID.player&&VID.player.destroy)VID.player.destroy();}catch(e){}
  $('#ytWrap').innerHTML='<div id="ytMount"></div>';$('#vid').classList.remove('on');VID=null;
}
function endVideo(why){
  if(!VID)return;var t=VID.t;teardownVideo();
  if(!t.preview){S.pending='';save();}
  if(why==='done'||why==='time'){SFX.win();toast('🎉 Video finished! Back to learning, champion!');say('Great watching! Back to learning!');}
  go(t.preview?'parent':'home');
}
$('#vClose').addEventListener('click',function(){
  if(!VID)return;
  if(VID.t.preview||confirm('Close the video? This reward will be used up.'))endVideo('closed');
});

/* ---------- 10. PARENT PANEL ---------- */
function pinGate(){if(!S.setup.done){setupModal(true);return;}pinPrompt(function(){go('parent');});}
function pinPrompt(ok){
  var wait=S.pinLock-Date.now();
  if(wait>0){toast('Too many tries. Wait '+Math.ceil(wait/1000)+'s');return;}
  var o=openModal('<h2>🔒 Parent PIN</h2><label class="field"><span>Enter your 4-digit PIN</span><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></label><div class="note badn" id="pinErr" style="display:none">Wrong PIN</div><div class="row"><button class="btn ok" id="pinGo" type="button">Unlock</button><button class="btn ghost" id="pinX" type="button">Cancel</button></div>');
  var inp=$('#pinIn',o);setTimeout(function(){inp.focus();},200);
  function chk(){if(inp.value===S.setup.pin){S.pinFail=0;save();closeModal();ok();}else{S.pinFail++;if(S.pinFail>=5){S.pinFail=0;S.pinLock=Date.now()+30000;}save();$('#pinErr',o).style.display='block';inp.value='';}}
  $('#pinGo',o).addEventListener('click',chk);inp.addEventListener('keydown',function(e){if(e.key==='Enter')chk();});$('#pinX',o).addEventListener('click',closeModal);
}
function setupModal(first){
  var s=S.setup,def=(location.protocol.indexOf('http')===0)?location.href.split('#')[0].split('?')[0]:'';
  var o=openModal('<h2>👨‍👩‍👦 Parent setup</h2>'+(first?'<p>A grown-up should do this once. It takes a minute!</p>':'')+
    '<label class="field"><span>Dad\'s email</span><input type="email" id="suDad" value="'+esc(s.dadEmail)+'"></label>'+
    '<label class="field"><span>Mom\'s email</span><input type="email" id="suMom" value="'+esc(s.momEmail)+'"></label>'+
    '<label class="field"><span>Send reward emails to</span><select id="suTo"><option value="dad">Dad</option><option value="mom">Mom</option><option value="both">Both</option></select></label>'+
    '<label class="field"><span>Parent PIN (4 digits)</span><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="suPin" placeholder="'+(s.pin?'leave empty to keep':'e.g. 4321')+'"></label>'+
    '<label class="field"><span>Confirm PIN</span><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="suPin2"></label>'+
    '<label class="field"><span>Web address of this app (so QR links open it)</span><input type="url" id="suUrl" placeholder="https://yourname.github.io/it-geek/" value="'+esc(s.appUrl||def)+'"></label>'+
    '<label class="field"><span>Reward QR on the iPad</span><select id="suQr"><option value="pin">Hidden until a parent enters the PIN (recommended)</option><option value="always">Show right away</option></select></label>'+
    '<label class="field"><span>Max video minutes</span><input type="number" id="suMin" min="3" max="60" value="'+(s.maxMin||15)+'"></label>'+
    '<div class="note badn" id="suErr" style="display:none"></div><div class="row"><button class="btn ok" id="suSave" type="button">Save ✔</button>'+(first?'':'<button class="btn ghost" id="suX" type="button">Cancel</button>')+'</div>');
  $('#suTo',o).value=s.sendTo;$('#suQr',o).value=s.qrMode;
  if(!first)$('#suX',o).addEventListener('click',closeModal);
  $('#suSave',o).addEventListener('click',function(){
    var d=$('#suDad',o).value.trim(),m=$('#suMom',o).value.trim(),p=$('#suPin',o).value,p2=$('#suPin2',o).value,err=$('#suErr',o),re=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    function bad(t){err.textContent=t;err.style.display='block';}
    if(!re.test(d)||!re.test(m))return bad('Please enter valid email addresses.');
    if(p||!s.pin){if(!/^\d{4}$/.test(p))return bad('PIN must be exactly 4 digits.');if(p!==p2)return bad('The two PINs do not match.');s.pin=p;}
    s.dadEmail=d;s.momEmail=m;s.sendTo=$('#suTo',o).value;s.qrMode=$('#suQr',o).value;s.appUrl=$('#suUrl',o).value.trim();s.maxMin=Math.max(3,Math.min(60,parseInt($('#suMin',o).value,10)||15));
    s.done=true;save();closeModal();toast('Saved ✔');if(first)go('home');else renderParent();
  });
}
function renderParent(){
  var d=todayStr(),day=S.days[d],t=day&&S.tokens[day.token],h='<div class="wrap"><h1>🔒 Parent panel</h1>';
  var secure=window.isSecureContext,camOk=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),isFile=location.protocol==='file:';
  h+='<div class="card"><h3>Today ('+d+')</h3><p>Worksheet: <b>'+(day?(day.done?'finished ✅':'in progress ('+Math.min(day.i,day.qs.length)+'/'+day.qs.length+')'):'not started')+'</b><br>Reward: <b>'+(t?({issued:'issued, not claimed yet 🎁',claimed:'claimed ✅',void:'cancelled'}[t.st]||t.st):'none yet')+'</b></p><div class="row">'+
    (t&&t.st==='issued'?'<button class="btn ok sm" id="pQr" type="button">🎁 Show reward QR</button><button class="btn sm" id="pMail" type="button">📧 Email it</button>':'')+
    '<button class="btn warn sm" id="pReset" type="button">↺ Reset today (new questions + new reward)</button><button class="btn ghost sm" id="pTest" type="button">▶ Test video player</button></div></div>';
  h+='<div class="card"><h3>Contacts &amp; security</h3><p>Dad: <b>'+esc(S.setup.dadEmail)+'</b><br>Mom: <b>'+esc(S.setup.momEmail)+'</b><br>Send to: <b>'+S.setup.sendTo+'</b> · QR on iPad: <b>'+(S.setup.qrMode==='pin'?'PIN-locked':'visible')+'</b> · Max video: <b>'+S.setup.maxMin+' min</b><br>App address: <b>'+esc(S.setup.appUrl||'(not set)')+'</b></p><div class="row"><button class="btn sm" id="pEdit" type="button">✏️ Edit setup / change PIN</button><button class="btn ghost sm" id="pSnd" type="button">'+(S.setup.sound?'🔊 Sound on':'🔇 Sound off')+'</button><button class="btn ghost sm" id="pSpk" type="button">'+(S.setup.speak?'🗣️ Read-aloud on':'🤐 Read-aloud off')+'</button></div></div>';
  h+='<div class="card"><h3>Approved video channels (automatic)</h3>'+CHANNELS.map(function(c){return '<div class="chrow"><input type="checkbox" data-c="'+c.key+'" '+(S.ch[c.key].on?'checked':'')+'><b>'+c.e+' '+c.n+'</b></div>';}).join('')+'<small>No video links to enter: each reward picks a random video from one of the ticked channels automatically (a different channel from yesterday).</small></div>';
  h+='<div class="card"><h3>This device</h3><div class="note '+(isFile?'badn':'good')+'">'+(isFile?'⚠️ Opened as a local file: the live camera and the YouTube player are blocked by iOS for file:// pages. Host this file on any free HTTPS site (GitHub Pages, Netlify Drop…) and enter its address in setup. Photo-scan and typed codes still work.':'✅ Opened from '+esc(location.origin||location.protocol)+(secure?' (secure)':' (not secure: camera needs https)'))+'</div><p style="margin:6px 0">Camera API: <b>'+(camOk?'available':'not available')+'</b> · QR library: <b>'+(window.QRCode?'loaded':'not loaded')+'</b> · Scanner library: <b>'+(window.jsQR?'loaded':'not loaded')+'</b></p></div>';
  h+='<div class="card"><h3>Progress</h3>'+(Object.keys(S.days).sort().reverse().slice(0,7).map(function(k){var x=S.days[k];return '<div class="chrow"><b style="width:120px">'+k+'</b><span>'+(x.done?'✅ done':'⏳ '+Math.min(x.i,x.qs.length)+'/'+x.qs.length)+'</span></div>';}).join('')||'<p>No worksheets yet.</p>')+'<div class="row"><button class="btn warn sm" id="pWipe" type="button">Erase all app data</button></div></div></div>';
  $('#s-parent').innerHTML=h;
  var b=function(id,fn){var x=$(id);if(x)x.addEventListener('click',fn);};
  b('#pQr',function(){qrUnlocked=true;go('done');});b('#pMail',function(){sendMail(t);});
  b('#pReset',function(){if(!confirm('Reset today? The current reward (if unclaimed) will be cancelled.'))return;if(t&&t.st==='issued')t.st='void';S.resets[d]=(S.resets[d]||0)+1;delete S.days[d];save();renderParent();toast('Reset ✔');});
  b('#pTest',function(){var c=CHANNELS.filter(function(x){return S.ch[x.key].on;})[0];if(!c){toast('Turn on a channel first');return;}playReward({id:'preview',ch:c.key,idx:0,preview:true});});
  b('#pEdit',function(){setupModal(false);});
  b('#pSnd',function(){S.setup.sound=!S.setup.sound;save();renderParent();});b('#pSpk',function(){S.setup.speak=!S.setup.speak;save();renderParent();});
  b('#pWipe',function(){if(confirm('Erase everything, including XP, streak and PIN?')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}});
  [].forEach.call(document.querySelectorAll('#s-parent [data-c]'),function(i){i.addEventListener('change',function(){S.ch[i.getAttribute('data-c')].on=i.checked;save();});});
}

/* ---------- 11. BOOT ---------- */
function handleHash(){
  var h=location.hash||'';
  if(h.indexOf('reward=')<0)return;
  var raw=h;try{history.replaceState(null,'',location.href.split('#')[0]);}catch(e){}
  if(!S.setup.done){return;}
  go('home');setTimeout(function(){handlePayload(raw);},300);
}
function init(){
  buildTabs();renderSplash();go('splash');
  window.addEventListener('hashchange',handleHash);
  if(S.setup.done&&!S.setup.appUrl&&location.protocol.indexOf('http')===0){S.setup.appUrl=location.href.split('#')[0].split('?')[0];save();}
  if((location.hash||'').indexOf('reward=')>=0&&S.setup.done)handleHash();
  document.addEventListener('visibilitychange',function(){if(document.hidden)stopCam();});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
