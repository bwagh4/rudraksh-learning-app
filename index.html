<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Rudraksh's IT Geek Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT Geek">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#26214f;--soft:#6b66a3;--eng:#ff5c8a;--mth:#3d8bff;--cs:#7c4dff;--ok:#2fbf71;--bad:#ff6b57;--sun:#ffc833;--glass:rgba(255,255,255,.82);--r:26px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;font-family:'Fredoka',ui-rounded,-apple-system,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:radial-gradient(circle at 15% 10%,#ffd9ec 0,transparent 45%),radial-gradient(circle at 90% 20%,#cfe3ff 0,transparent 45%),radial-gradient(circle at 50% 100%,#e2d6ff 0,transparent 55%),#f4f0ff;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,h4{margin:.2em 0}
b{font-weight:700}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 22px 26px;display:none}
.screen.active{display:block;animation:pop .35s ease}
.wrap{max-width:900px;margin:0 auto}
.center{text-align:center}
.sub{color:var(--soft);font-size:20px;margin:.3em 0 1em}
small{color:var(--soft)}
#tabs{display:flex;height:calc(80px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid rgba(124,77,255,.15);box-shadow:0 -6px 24px rgba(80,60,160,.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--soft)}
.tab i{font-style:normal;font-size:30px;line-height:1.1;transition:transform .2s}
.tab.on{color:var(--cs)}
.tab.on i{transform:scale(1.2) translateY(-2px)}
.card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:var(--r);padding:20px;margin:0 0 16px;box-shadow:0 8px 28px rgba(80,60,160,.12);border:1px solid rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;border-radius:22px;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8f5bff,#5a8bff);box-shadow:0 8px 18px rgba(100,80,220,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.big{min-height:72px;font-size:26px;padding:0 40px}
.btn.ok{background:linear-gradient(135deg,#34c77b,#1fa3a3);box-shadow:0 8px 18px rgba(30,160,120,.35)}
.btn.warn{background:linear-gradient(135deg,#ff8a5c,#ff5c8a);box-shadow:0 8px 18px rgba(255,92,120,.3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(80,60,160,.15)}
.btn[disabled]{opacity:.4;box-shadow:none}
.btn.sm{min-height:46px;font-size:17px;padding:0 18px;border-radius:16px}
.icon{width:54px;height:54px;border-radius:18px;background:#fff;font-size:24px;box-shadow:0 4px 12px rgba(80,60,160,.15);flex:none}
button#vClose{color:#26214f}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:600;font-size:16px;background:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center}
.row>*{margin:6px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,51,.9)}50%{box-shadow:0 0 0 12px rgba(255,200,51,0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(6deg)}}
@keyframes scanl{0%{top:6%}100%{top:90%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* splash */
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.byte{font-size:150px;line-height:1;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(80,60,160,.3))}
.title{font-size:54px;margin:.1em 0;background:linear-gradient(90deg,#ff5c8a,#7c4dff,#3d8bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.floaty{position:absolute;font-size:54px;animation:floaty 5s ease-in-out infinite;opacity:.85}
.floaty.f1{left:10%;top:12%}.floaty.f2{right:12%;top:16%;animation-delay:.8s}.floaty.f3{left:14%;bottom:16%;animation-delay:1.6s}.floaty.f4{right:16%;bottom:20%;animation-delay:2.4s}.floaty.f5{left:46%;top:6%;animation-delay:3s}
/* home */
.hero{display:flex;align-items:center}
.hero .byte{font-size:92px;animation-duration:2.6s}
.bubble{background:#fff;border-radius:24px 24px 24px 6px;padding:14px 20px;font-size:21px;margin-left:12px;box-shadow:0 6px 18px rgba(80,60,160,.12)}
.stats{display:flex;flex-wrap:wrap;margin:0 -6px 6px}
.stat{flex:1;min-width:150px;margin:6px;padding:14px 16px;border-radius:22px;background:var(--glass);box-shadow:0 6px 18px rgba(80,60,160,.1);text-align:center}
.stat b{font-size:30px;display:block}
.bar{height:14px;border-radius:99px;background:rgba(124,77,255,.15);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc833,#ff5c8a);border-radius:99px;transition:width .6s}
.todayc{background:linear-gradient(135deg,#7c4dff,#3d8bff);color:#fff}
.todayc .sub{color:#e8e2ff}
.doms{display:flex;flex-wrap:wrap;margin:10px -5px 0}
.dchip{flex:1;min-width:130px;margin:5px;padding:12px;border-radius:18px;background:rgba(255,255,255,.2);text-align:center;font-weight:600;font-size:18px}
.badges{display:flex;flex-wrap:wrap}
.bdg{font-size:38px;margin:4px 10px 4px 0;filter:grayscale(1);opacity:.35}
.bdg.on{filter:none;opacity:1}
/* worksheet */
.wtop{display:flex;align-items:center;margin-bottom:10px}
.wtop>*{margin-right:10px}
.pillD{padding:8px 16px;border-radius:99px;color:#fff;font-weight:700;font-size:18px;white-space:nowrap}
.dots{flex:1;display:flex;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(38,33,79,.15);margin:3px}
.dot.ok{background:var(--ok)}.dot.no{background:var(--sun)}.dot.cur{outline:3px solid var(--cs);outline-offset:2px}
.qcard{background:var(--glass);border-radius:30px;padding:22px;box-shadow:0 10px 30px rgba(80,60,160,.14)}
.qprompt{font-size:29px;font-weight:600;text-align:center;line-height:1.25}
.qvis{margin:12px 0;text-align:center}
.bigemoji{font-size:90px;line-height:1.1}
.svgi{width:96px;height:96px}
.sent{font-size:34px;font-weight:600;margin:6px 0}
.blank{display:inline-block;min-width:90px;border-bottom:5px solid var(--cs);color:var(--cs);text-align:center;margin:0 6px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:14px;margin-top:10px}
.opts.c1{grid-template-columns:1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{min-height:92px;border-radius:24px;background:#fff;font-size:36px;font-weight:700;padding:10px;border:4px solid transparent;box-shadow:0 6px 16px rgba(80,60,160,.14);transition:transform .12s,background .2s}
.opt:active{transform:scale(.96)}
.opt .em{font-size:60px;display:block;line-height:1.1}
.opt .nm{font-size:22px;display:block}
.opt .svgi{width:68px;height:68px}
.opt.ok{background:#d6f8e5;border-color:var(--ok);animation:bounce .5s}
.opt.bad{background:#ffe1dc;border-color:var(--bad);animation:shake .4s}
.opt.dim{opacity:.35;pointer-events:none}
.fb{min-height:54px;margin-top:12px;border-radius:18px;padding:10px 16px;font-size:21px;font-weight:600;text-align:center;display:none}
.fb.show{display:block;animation:fadeUp .25s}
.fb.ok{background:#d6f8e5;color:#127a47}.fb.bad{background:#ffe9e4;color:#b8412f}.fb.info{background:#e8e2ff;color:#4a3bb0}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.emojirow{font-size:44px;line-height:1.25;max-width:640px;margin:0 auto}
.emojirow .g{display:inline-block;margin:4px 12px;white-space:nowrap}
.emojirow .out{opacity:.25;position:relative}
.emojirow .out:after{content:'\274C';position:absolute;left:4px;top:4px;font-size:30px;opacity:1}
.lineup{font-size:60px;white-space:nowrap}.lineup small{font-size:20px}
.seq{display:flex;justify-content:center;flex-wrap:wrap}
.sb{min-width:76px;height:76px;margin:5px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;box-shadow:0 4px 12px rgba(80,60,160,.14)}
.sb.q{background:#fff6cf;border:4px dashed var(--sun);color:var(--sun)}
.numcard{font-size:64px}
.eq{font-size:58px;font-weight:700;margin-top:6px}
.passage{background:#fffdf3;border:3px dashed #ffd978;border-radius:22px;padding:14px 20px;text-align:left;font-size:25px;line-height:1.5;max-width:700px;margin:0 auto}
.passage h4{font-size:24px;color:var(--eng)}
.sayb{margin-top:6px;background:#fff;padding:8px 16px;border-radius:14px;font-size:18px;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.scene{position:relative;width:270px;height:190px;margin:0 auto}
.scene.mini{transform:scale(.55);margin:-40px -40px -34px}
.scene span{position:absolute;line-height:1;transform:translate(-50%,-50%)}
.sc-in .L{left:50%;top:60%;font-size:120px;z-index:2}.sc-in .S{left:50%;top:32%;font-size:64px;z-index:1}
.sc-on .L{left:50%;top:70%;font-size:110px}.sc-on .S{left:50%;top:24%;font-size:72px}
.sc-under .L{left:50%;top:28%;font-size:110px}.sc-under .S{left:50%;top:80%;font-size:60px}
.sc-behind .L{left:38%;top:55%;font-size:120px;z-index:2}.sc-behind .S{left:62%;top:58%;font-size:80px;z-index:1}
.sc-nextto .L{left:26%;top:55%;font-size:100px}.sc-nextto .S{left:74%;top:60%;font-size:80px}
/* grid */
.gridq{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px;width:330px;margin:10px auto}
.gcell{height:96px;border-radius:18px;background:#fff;font-size:52px;box-shadow:0 4px 10px rgba(80,60,160,.14);border:4px solid transparent}
.gcell.ok{background:#d6f8e5;border-color:var(--ok)}.gcell.bad{background:#ffe1dc;animation:shake .4s}
/* keyboard */
.kb{background:#3a3566;border-radius:22px;padding:10px 8px 4px;margin:12px auto 0;max-width:860px}
.kr{display:flex;justify-content:center;margin-bottom:7px}
.k{position:relative;flex:1;min-width:0;height:62px;margin:0 3px;border-radius:12px;font-size:24px;font-weight:700;color:var(--ink);border-bottom:4px solid rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.k:active{transform:translateY(3px);border-bottom-width:1px}
.k.bump:after{content:'';position:absolute;bottom:7px;width:16px;height:4px;border-radius:2px;background:rgba(38,33,79,.5)}
.k.sp{font-size:15px;flex:1.7}.k.sp-SPACE{flex:7;font-size:18px}.k.sp-BACK{flex:1.9}.k.sp-SHIFT{flex:2}.k.sp-ENTER{flex:2.2}
.f0{background:#ffb3cc}.f1{background:#ffcc99}.f2{background:#fff0a0}.f3{background:#b5f0c0}.f4{background:#aeeaf5}.f5{background:#b9c8ff}.f6{background:#d8bcff}.f7{background:#f3b8f0}.f8{background:#e3e1f7}
.k.hint{animation:pulse 1s infinite;transform:scale(1.08);z-index:2}
.k.ok{background:var(--ok);color:#fff}.k.no{animation:shake .35s;background:var(--bad);color:#fff}
.tcopy{font-size:54px;font-weight:700;letter-spacing:8px;color:var(--cs)}
.tbox{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tbox.long .tb{width:42px;height:56px;font-size:30px;margin:0 3px 6px}.tbox.long .tb.sp{width:22px}
.tb{width:56px;height:68px;margin:0 5px;border-radius:14px;background:#fff;border-bottom:6px solid #c9c4ee;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tb.sp{width:34px}
.tb.cur{border-color:var(--sun);animation:pulse 1.2s infinite}.tb.done{background:#d6f8e5;border-color:var(--ok);color:#127a47}
/* drag */
.slots{display:grid;grid-gap:12px;margin-bottom:12px}
.slots.s2{grid-template-columns:1fr 1fr}.slots.s1{grid-template-columns:1fr}
.slot{border:4px dashed #b9b3e8;border-radius:22px;background:rgba(255,255,255,.7);padding:10px;text-align:center;min-height:100px}
.slot.over{border-color:var(--sun);background:#fff8dc}
.slot .sl{font-size:48px;line-height:1.1;font-weight:700}
.slot .sl .svgi{width:70px;height:70px}
.slot .sl small{font-size:17px;font-weight:600;display:block}
.drop{min-height:62px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.slots.s1 .slot{display:flex;align-items:center}.slots.s1 .slot .sl{flex:none;margin-right:16px;min-width:120px}.slots.s1 .slot .drop{flex:1}
.tray{display:flex;flex-wrap:wrap;justify-content:center;min-height:80px;padding:8px;border-radius:20px;background:rgba(124,77,255,.08)}
.chip{display:inline-flex;align-items:center;margin:6px;padding:10px 20px;border-radius:18px;background:#fff;font-size:28px;font-weight:700;box-shadow:0 5px 12px rgba(80,60,160,.2);touch-action:none;-webkit-user-select:none}
.chip .ci{font-size:38px;margin-right:8px}.chip .svgi{width:44px;height:44px;margin-right:8px}
.chip.sel{outline:5px solid var(--sun)}.chip.lock{background:#d6f8e5;pointer-events:none}.chip.ghost{opacity:.25}.chip.no{animation:shake .4s;background:#ffe1dc}
.chip.fly{position:fixed;z-index:999;pointer-events:none;transform:scale(1.12) rotate(-3deg);margin:0}
.dzfoot{text-align:center;margin-top:12px}
/* done */
.trophy{font-size:110px;animation:bounce 1.6s infinite}
.starsRow{display:flex;flex-wrap:wrap;justify-content:center}
.sc{margin:6px;padding:14px 22px;border-radius:22px;color:#fff;font-weight:700;text-align:center;font-size:20px}
.sc b{display:block;font-size:32px;letter-spacing:3px}
.qrCard{text-align:center}
#qrBox{display:inline-block;padding:16px;background:#fff;border-radius:24px;box-shadow:0 8px 22px rgba(80,60,160,.2)}
#qrBox img,#qrBox canvas{display:block}
.lockq{padding:34px 10px;font-size:22px}
.lockq .big{font-size:80px}
/* scan */
.camwrap{position:relative;max-width:560px;min-height:300px;margin:0 auto;border-radius:28px;overflow:hidden;background:#1d1a3d;aspect-ratio:1/1;box-shadow:0 10px 30px rgba(80,60,160,.3)}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap .ph{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfcdf5;font-size:22px;text-align:center;padding:20px}
.frame{position:absolute;left:14%;top:14%;right:14%;bottom:14%;border:5px solid rgba(255,255,255,.9);border-radius:26px;display:none}
.frame i{position:absolute;left:6%;right:6%;height:4px;background:var(--sun);box-shadow:0 0 12px var(--sun);animation:scanl 1.8s linear infinite alternate}
.camwrap.live .frame{display:block}.camwrap.live .ph{display:none}
/* lab */
.fact{text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}
.fact .e{font-size:84px}.fact p{font-size:23px;margin:.3em 0}
.steps{display:flex;flex-wrap:wrap;justify-content:center}
.stp{width:150px;margin:8px;padding:12px;border-radius:20px;background:#fff;text-align:center;font-size:17px;box-shadow:0 5px 14px rgba(80,60,160,.12);opacity:0;animation:fadeUp .5s forwards}
.stp i{font-style:normal;font-size:48px;display:block}
.games{display:flex;flex-wrap:wrap}
.game{flex:1;min-width:200px;margin:6px;padding:18px;border-radius:22px;color:#fff;font-weight:700;font-size:21px;text-align:center}
.game i{font-style:normal;font-size:46px;display:block}
/* parent */
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:4px;font-size:17px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field input[type=url],.field select{width:100%;height:54px;border-radius:16px;border:2px solid #d9d4f5;padding:0 14px;font-size:19px;background:#fff;color:var(--ink)}
.chrow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.chrow input[type=text]{flex:1;height:44px;font-size:15px;margin-left:10px;border-radius:12px;border:2px solid #d9d4f5;padding:0 10px}
.chrow input[type=checkbox]{width:28px;height:28px;margin-right:10px}
.note{font-size:16px;padding:12px 16px;border-radius:16px;background:#fff5d6;color:#7a5a00;margin:8px 0}
.good{background:#d6f8e5;color:#127a47}.badn{background:#ffe9e4;color:#b8412f}
/* modal/video/toast */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(38,33,79,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:pop .25s}
.sheet{background:#fff;border-radius:32px;padding:26px;max-width:640px;width:100%;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h2{font-size:30px}
.sheet .big{font-size:92px;text-align:center;line-height:1.1}
.sheet p{font-size:21px;line-height:1.4}
.sheet .row{justify-content:center;margin-top:10px}
#vid{position:fixed;left:0;top:0;right:0;bottom:0;z-index:200;background:#0c0a22;display:none;flex-direction:column}
#vid.on{display:flex}
.vbar{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;color:#fff;font-size:20px;font-weight:600}
.vbar #vTitle{flex:1}.vbar #vTime{margin-right:14px;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:99px;font-size:17px}
.vbox{flex:1;position:relative;min-height:0}
#ytWrap{position:absolute;left:0;top:0;right:0;bottom:0;background:#000}#ytWrap iframe,#ytWrap #ytMount{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
/* shields keep the child inside the app: they cover the YouTube title/share links (top) and logo link (bottom-right) */
.vshield{position:absolute;z-index:2;background:transparent}.vs-top{left:0;right:0;top:0;height:76px}.vs-br{right:0;bottom:0;width:150px;height:58px}
/* message is a banner only: it must never hide YouTube's own play button (iOS needs a real tap on it) */
#vCover{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;display:none;pointer-events:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:30px;font-weight:700;-webkit-tap-highlight-color:transparent}
#vCover.live{display:flex;pointer-events:auto;background:transparent}
#vCover.paused{display:flex;pointer-events:auto;background:linear-gradient(135deg,#2b2060,#5a3cc8)}
#vCover .vbig{font-size:110px;line-height:1.1}#vCover .btn{margin-top:18px;font-size:30px;min-width:260px}
.vbar .icon{margin-left:8px;background:rgba(255,255,255,.18);color:#fff}
#vMsg{position:absolute;z-index:3;left:14px;right:14px;top:10px;display:none;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;text-align:center;padding:12px 18px;border-radius:20px;background:rgba(124,77,255,.92);pointer-events:none}

  .icon:hover,.pstk:hover{transform:scale(1.1)}
  [role=button]:hover:not(.pit),.card[role=button]:hover{box-shadow:0 10px 22px rgba(80,60,160,.22)}
  .chip:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 16px rgba(80,60,160,.25)}
  .slot:hover{outline:3px dashed #7c4dff;outline-offset:2px}
  .gcell:hover,.opl:hover{filter:brightness(.97);box-shadow:0 4px 12px rgba(80,60,160,.2)}
  .k:hover{filter:brightness(1.1)}
  .pit:hover{filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
}
body.mouse .pit{cursor:grab}body.mouse .pit.drag{cursor:grabbing}
/* ---- v2: parent tabs, syllabus, dashboard ---- */
.ptabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.pt{flex:1;min-width:120px;padding:12px 8px;border-radius:16px;background:#fff;font-weight:700;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.08);color:var(--soft)}
.pt.on{background:var(--cs);color:#fff}
.p1tag{display:inline-block;font-size:13px;background:#ffe27a;color:#7a5200;border-radius:10px;padding:2px 8px;vertical-align:middle}
.sl{display:block;font-weight:600;margin:8px 0 3px}.sl small{font-weight:400;color:var(--soft)}
.sl .fi,.syrow .fi{width:100%}
.syrow{display:flex;gap:8px;align-items:center;margin:5px 0;flex-wrap:wrap}.syrow .fi{flex:1;min-width:140px}
.cimg{max-width:100%;max-height:170px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.cqrow{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.cqt{flex:1;min-width:160px}.cqt small{display:block;color:var(--soft)}
.ctag{background:#efe9ff;color:#5a3cc8;border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{flex:1;min-width:120px;background:#f4f2ff;border-radius:18px;padding:10px;text-align:center}.tile b{display:block;font-size:26px}.tile small{color:var(--soft)}
.abar{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap}.al1{width:130px;font-weight:600}.atrk{flex:1;min-width:120px;height:16px;background:#ece9ff;border-radius:10px;overflow:hidden}.afill{height:100%;border-radius:10px;transition:width .6s}
.abar b{width:48px;text-align:right}.abar small{color:var(--soft);min-width:90px}
.dsvg{width:100%;height:auto;display:block}
.sdays{display:flex;gap:5px;flex-wrap:wrap}.sd{width:48px;text-align:center;padding:6px 0;border-radius:12px;background:#f1f0fa;font-size:13px;color:var(--soft)}.sd i{display:block;font-style:normal;font-size:18px;min-height:22px}.sd.ws{background:#c8f3d8}.sd.qz{background:#cfe3ff}.sd.pt{background:#fff0b8}
/* ---- v2: sticker playground ---- */
.plbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.plscn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.plscn .on{outline:3px solid var(--cs)}
.pcv{position:relative;width:100%;aspect-ratio:4/3;border-radius:26px;overflow:hidden;box-shadow:0 8px 24px rgba(80,60,160,.25);touch-action:none;user-select:none;-webkit-user-select:none}
.pdeco{position:absolute;inset:0;font-size:46px;letter-spacing:.9em;padding:3% 6%;opacity:.8;pointer-events:none;word-spacing:1.5em}
.pit{position:absolute;line-height:1;touch-action:none;outline:none;white-space:nowrap}
.pit.sel{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #7c4dff)}
.pit:focus-visible{outline:4px solid #ffb300;outline-offset:6px;border-radius:12px}
.pit.drag{z-index:5}
.pbar{display:flex;gap:6px;justify-content:center;align-items:center;min-height:52px;flex-wrap:wrap;margin-top:8px}
.ptray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;background:rgba(255,255,255,.7);border-radius:20px}
.phint{display:block;text-align:center;font-size:15px;font-weight:600;color:var(--soft);padding:4px 10px}
.pstk{font-size:44px;line-height:1;padding:8px 10px;border-radius:16px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.1);touch-action:none;min-width:64px;min-height:64px}
/* ---- v3: typography hierarchy ---- */
h1{font-weight:800;letter-spacing:-.01em}
.sub{font-weight:500;font-size:19px}
.qprompt{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
.qprompt .qh{display:block}
.qprompt .sup,.qprompt small{display:block;font-size:19px;font-weight:500;color:var(--soft);letter-spacing:0;line-height:1.35;margin-top:8px}
.qprompt b{color:var(--cs)}
.pillD{font-size:14px;letter-spacing:.04em;text-transform:uppercase;font-weight:800}
/* ---- v3: navigation ---- */
#tabs{height:calc(86px + env(safe-area-inset-bottom))}
.tab{position:relative;gap:3px;font-size:15px;font-weight:700;letter-spacing:.01em;color:#57528c;transition:color .15s}
.tab i{width:58px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:19px;font-size:26px;transition:background .2s,transform .15s}
.tab.on{color:var(--cs)}.tab.on i{background:rgba(124,77,255,.17);transform:none}
body.nokb .tab kbd{position:absolute;top:4px;right:calc(50% - 40px);margin:0;font-size:10px;padding:0 5px;opacity:.7}
/* ---- v3: unified hover + press ---- */
.game,.al,.card[role=button],.tab,.opt,.chip,.pstk,.icon,.slot,.gcell{transition:transform .15s,box-shadow .2s,filter .2s,background .2s}
.game,.al.on,.al.lock,#hLab{cursor:pointer}
.game:active,.al:active,.tab:active,.card[role=button]:active,.icon:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){
  .game:hover{transform:translateY(-4px) scale(1.02);filter:brightness(1.07);box-shadow:0 14px 26px rgba(60,40,140,.3)}
  .al.on:hover{transform:translateY(-3px) scale(1.1);box-shadow:0 10px 18px rgba(124,77,255,.35)}
  .al.lock:hover{background:#ece8ff;transform:scale(1.04)}
  .tab:hover i{background:rgba(124,77,255,.1)}
  .micbtn:not(.off):hover{transform:scale(1.06)}
}
/* ---- v3: sticker album ---- */
.alhead{font-weight:800;font-size:17px;color:var(--ink);margin:12px 0 4px;letter-spacing:.02em}.alhead.lk{color:var(--soft)}
.album{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(66px,1fr))!important;gap:8px!important}
.al{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:66px;padding:4px!important;border-radius:18px!important;font-size:36px!important;line-height:1;opacity:1!important;border:0}
.al.on{background:linear-gradient(145deg,#fff,#f3edff)!important;box-shadow:0 0 0 3px #ffd54a,0 5px 12px rgba(124,77,255,.25)!important}
.al.lock{background:repeating-linear-gradient(135deg,#f1effa,#f1effa 8px,#e9e6f8 8px,#e9e6f8 16px)!important;border:2px dashed #b9b3e0;box-shadow:none!important;color:#9a95c8}
.al.lock b{font-size:30px;font-weight:800;line-height:1}.al.lock small{font-size:11px;font-weight:700;color:#9a95c8}
.alnone{grid-column:1/-1;color:var(--soft);font-weight:600;padding:8px 2px}
/* ---- v3: playground fills the screen ---- */
#s-play.active{animation:plIn .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes plIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.pcv{aspect-ratio:auto!important;height:calc(100vh - 330px);min-height:340px;max-height:780px}
/* ---- v3: Byte's Voice Lab ---- */
.vlcard{background:linear-gradient(135deg,#fff6e0,#ffe9f3)}
.vlbot,.vbot{font-size:54px;line-height:1;margin-right:12px}
.vbot.talk,.vlbot{animation:bounce 1.2s ease-in-out infinite}.vbot:not(.talk){animation:none}
.vbyte{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.vbub{flex:1;background:#fff;border-radius:22px 22px 22px 6px;padding:12px 16px;font-size:20px;font-weight:600;box-shadow:0 4px 12px rgba(80,60,160,.15)}
.vfact{text-align:center;background:#f4f2ff;border-radius:24px;padding:12px 16px;margin:8px 0}
.vcat{display:inline-block;background:#7c4dff;color:#fff;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 14px}
.vem{font-size:74px;line-height:1.1}.vft{font-size:22px;font-weight:600;margin:4px 0 0;line-height:1.35}
.vlab{text-align:center;font-weight:800;font-size:17px;color:var(--soft);margin-top:10px;text-transform:uppercase;letter-spacing:.06em}
.vtarget{text-align:center;font-size:36px;font-weight:800;line-height:1.5;padding:6px 4px}
.vtarget .w{display:inline-block;padding:0 10px;border-radius:14px;margin:2px;transition:background .3s}
.vtarget .w.ok{background:#c8f3d8;color:#157a45}.vtarget .w.miss{background:#ffe0c8;color:#b5541c}
.vwave{display:flex;gap:6px;height:60px;align-items:center;justify-content:center}
.vwave i{display:block;width:9px;height:10px;border-radius:6px;background:linear-gradient(#ff5c8a,#7c4dff);opacity:.35;transition:opacity .2s}
.vwave.on i{opacity:1;animation:wv .9s ease-in-out infinite}
.vwave.on.loud i{filter:brightness(1.2);transform:scaleY(1.3)}
.vwave.on i:nth-child(2n){animation-delay:.12s}.vwave.on i:nth-child(3n){animation-delay:.25s}.vwave.on i:nth-child(5n){animation-delay:.4s}.vwave.on i:nth-child(7n){animation-delay:.07s}
@keyframes wv{0%,100%{height:10px}50%{height:54px}}
.vheard{text-align:center;color:var(--soft);font-weight:600;min-height:26px;font-size:18px}
.vctl{display:flex;gap:14px;justify-content:center;align-items:center;margin:8px 0}
.micbtn{width:124px;height:124px;border-radius:50%;font-size:56px;color:#fff;background:linear-gradient(135deg,#ff5c8a,#ff8a5c);box-shadow:0 10px 24px rgba(255,92,120,.45);transition:transform .15s,box-shadow .2s}
.micbtn:active{transform:scale(.93)}.micbtn.rec{animation:micp 1s ease-in-out infinite;background:linear-gradient(135deg,#e63946,#ff5c8a)}.micbtn.off{filter:grayscale(.7);opacity:.6}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(255,92,120,.55)}50%{box-shadow:0 0 0 22px rgba(255,92,120,0)}}
.vst{text-align:center;font-weight:600;color:var(--soft);font-size:18px;margin:4px 0 10px}
.vtype{margin-top:12px}.vtype summary{cursor:pointer;font-weight:700;color:var(--soft);text-align:center;padding:8px}
.vtype form{display:flex;gap:8px;margin-top:6px}.vtype .fi{flex:1}
#vNext[hidden]{display:none}
/* ---- v4: alarm, voice answers, family notes ---- */
.alarm{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#ffe27a,#ff9ec4 55%,#7c4dff);animation:alin .35s ease}
@keyframes alin{from{opacity:0}to{opacity:1}}
.alcard{width:100%;max-width:640px;text-align:center;background:rgba(255,255,255,.92);border-radius:36px;padding:28px 22px;box-shadow:0 20px 60px rgba(60,20,120,.4)}
.alcard h1{font-size:40px;margin:.1em 0;font-weight:800}.alsay{font-size:24px;font-weight:600;margin:.3em 0 .6em}
.albyte{position:relative;display:inline-block;font-size:120px;line-height:1;animation:albounce 1s ease-in-out infinite}
.alring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:6px solid rgba(255,92,138,.6);animation:alpulse 1.6s ease-out infinite;pointer-events:none}.alring.r2{animation-delay:.8s}
@keyframes alpulse{from{transform:scale(.7);opacity:.9}to{transform:scale(1.9);opacity:0}}
@keyframes albounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.albell{font-size:40px;animation:alring .6s ease-in-out infinite alternate;display:inline-block}@keyframes alring{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.alprog{height:16px;background:#ece9ff;border-radius:10px;overflow:hidden;margin:6px auto;max-width:360px}.alprog div{height:100%;background:linear-gradient(90deg,#34c77b,#1fa3a3);border-radius:10px}
.alhint{font-weight:700;color:#b5541c;font-size:20px}
#alHear.pulse{animation:micp 1s ease-in-out infinite;background:#ffe27a}
.micq.rec{animation:micp 1s ease-in-out infinite;background:#ffe0e6;color:#c0143c}
.fnote{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff3d6,#ffe1ee);border:2px solid #ffc833}.fnico{font-size:40px}
.tapnote{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:9998;animation:bounce 1s infinite}
.qqcard{background:linear-gradient(135deg,#e6f7ff,#efe6ff)}
#fnRec.rec{background:#e63946;color:#fff;animation:micp 1s ease-in-out infinite}
</style>

      ctl[fd.id]={get:function(){return i.checked;},set:function(v){i.checked=!!v;i.dispatchEvent(new Event('change'));},clear:function(){i.checked=!!fd.start;i.dispatchEvent(new Event('change'));},dis:function(){i.disabled=true;}};
    }else if(fd.t==='range'){
      i=el('<input class="rng" type="range" min="'+fd.min+'" max="'+fd.max+'" step="1" value="'+fd.start+'">');o=el('<div class="rngv">'+fd.start+'</div>');c.appendChild(i);c.appendChild(o);

      ctl[fd.id]={get:function(){return +i.value;},set:function(v){i.value=v;o.textContent=v;},clear:function(){i.value=fd.start;o.textContent=fd.start;},dis:function(){i.disabled=true;}};

}
function buildWorksheet(date,n){
  var H=mkHist(false),r=makeRng(hashStr('rudra-it|'+date+'|'+(n||0)),H),qs=[];
  function dom(name,fns){r.shuffle(fns).forEach(function(f){var q=f(r);q.domain=name;qs.push(q);});}
  dom('english',[qVerb,qPronoun,qDigraph,qReading,qPrep,qSpellWord]);
  dom('math',[qNumbers,qPosition,qPattern,qSpelling,qAddSub,qMatchCounts]);
  dom('cs',[qKey,qTyping,qHardware,qNetwork,qIO,qTypeDevice]);
  dom('forms',r.fresh(FORMGENS,4));
  qs=pickCustom(date,S.setup.p1ws==null?4:S.setup.p1ws).concat(qs);   /* parent syllabus questions: Priority 1, always first */
  qs.forEach(function(q,i){q.id='q'+i;});
  commitHist(H);
  return qs;
}
function buildMini(type,seed){
  var r=makeRng(hashStr('mini|'+type+'|'+seed),mkHist(true)),qs=[],i;
  if(type==='typing'){for(i=0;i<3;i++)qs.push(qKey(r));for(i=0;i<3;i++)qs.push(qTyping(r));qs.push(qKey(r));}
  else if(type==='io'){['sort','type','sort','type'].forEach(function(v){qs.push(qIO(r,v));});}
  else if(type==='net'){['sort','type','sort','type'].forEach(function(v){qs.push(qNetwork(r,v));});}
  else if(type==='defs'){['tech','hw','tech','hw'].forEach(function(v){qs.push(qDefs(r,v));});}
  else if(type==='spell3'){for(i=0;i<5;i++)qs.push(spellQ(r.pick(i%2?TECHW:W3),i%2?'Tech spelling':'3-letter spelling'));}
  else if(type==='numsp'){for(i=0;i<5;i++)qs.push(qSpelling(r));}
  else if(type==='graph'){qs.push(qGraphRead(r));qs.push(qGraphRead(r));qs.push(qGraphBuild(r));qs.push(qGraphBuild(r));}
  else{['match','typename','match','typename'].forEach(function(v){qs.push(qHardware(r,v));});}
  qs.forEach(function(q,j){q.domain=q.domain||'cs';q.id='m'+j;});
  return qs;

}

const FOCUSABLE='button:not(:disabled),[tabindex="0"],input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),a[href]';

function spatial(dir){
  var a=document.activeElement,list=focusables();if(!list.length)return false;
  if(!a||a===document.body||list.indexOf(a)<0){focusEl(list[0]);return true;}
  var ar=rectOf(a),ax=ar.left+ar.width/2,ay=ar.top+ar.height/2,best=null,bs=1e12;
  list.forEach(function(e){
    if(e===a)return;var r=rectOf(e),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay,prim,cross;
    if(dir==='ArrowRight'){prim=dx;cross=Math.abs(dy);}else if(dir==='ArrowLeft'){prim=-dx;cross=Math.abs(dy);}else if(dir==='ArrowDown'){prim=dy;cross=Math.abs(dx);}else{prim=-dy;cross=Math.abs(dx);}
    if(prim<=2)return;var sc=prim+cross*2.5;if(sc<bs){bs=sc;best=e;}
  });

document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName,k=e.key,ty=tag==='INPUT'?t.type:'';
  var typing=(tag==='INPUT'&&/^(text|number|email|password|url|search|tel)$/.test(ty))||tag==='TEXTAREA',inSel=tag==='SELECT',isRange=ty==='range',isRadio=ty==='radio';
  /* a real keyboard was used (outside text boxes, which iPad's own keyboard also fills) -> hide the on-screen keyboard */
  if(e.isTrusted&&!typing&&!inSel&&k&&k!=='Unidentified'&&!S.setup.hwSeen){S.setup.hwSeen=true;save();applyKbMode();}
  /* never let the page zoom from the keyboard */
  if((e.ctrlKey||e.metaKey)&&(k==='+'||k==='-'||k==='='||k==='_'||k==='0')){e.preventDefault();return;}
  var mod=e.ctrlKey||e.metaKey||e.altKey,modal=modalOpen(),q=(cur==='work'&&SES)?SES.qs[SES.i]:null,kind=q&&q.kind,letterKind=(kind==='typeText'||kind==='tapKey');

    if(k===' '||k==='k'||k==='K'){e.preventDefault();toggleVideo();return;}
    if(k==='n'||k==='N'){var vn=$('#vNext');if(vn)vn.click();return;}

  if(CURKEYS&&!mod&&!typing&&!inSel&&!modal&&!e.defaultPrevented){if(CURKEYS(e)){e.preventDefault();e.stopImmediatePropagation();return;}}
  if(e.defaultPrevented)return;

  if(k==='Tab'&&modal){
    var fl=focusables();if(fl.length){var i=fl.indexOf(document.activeElement);
      if(e.shiftKey&&(i<=0)){e.preventDefault();focusEl(fl[fl.length-1]);}else if(!e.shiftKey&&(i===fl.length-1)){e.preventDefault();focusEl(fl[0]);}else if(i<0){e.preventDefault();focusEl(fl[0]);}}
    return;
  }
  if(k==='Escape'){
    if(modal){e.preventDefault();closeModal();return;}
    if(typing||inSel){t.blur();return;}
    if(cur==='work'||cur==='game'){e.preventDefault();var x=$('#wExit')||$('#gExit');if(x)x.click();}else if(cur==='play'){e.preventDefault();go('home');}else if(cur==='voice'){e.preventDefault();go('lab');}

  }

    if(e.repeat){e.preventDefault();return;}
    if(tag==='TEXTAREA'){if(e.ctrlKey||e.metaKey){var f=t.closest('form');if(f){e.preventDefault();if(f.requestSubmit)f.requestSubmit();else f.dispatchEvent(new Event('submit',{cancelable:true}));return;}}else return;}
    if(cur==='work'&&QS&&QS.done&&!modal){var nx=$('#wNext');if(nx&&!nx.disabled){e.preventDefault();nx.click();return;}}
    if(typing||inSel||isRange||tag==='BUTTON'||tag==='A'||tag==='LABEL'||isRadio||ty==='checkbox')return;   /* the browser handles these */
    if(t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();return;}
    var btn=null;
    if(modal)btn=modal.querySelector('.btn:not(.ghost):not(:disabled)')||modal.querySelector('button:not(:disabled)');
    else if(cur==='splash')btn=$('#goBtn');
    else if(cur==='home')btn=$('#hResume')||$('#hGo');
    if(btn){e.preventDefault();btn.click();}
    return;
  }
  if(typing||inSel||isRange)return;
  if(k==='Enter'||mod&&!(e.altKey&&(e.code==='KeyH'||e.code==='KeyS'||e.code==='KeyV')))return;
  /* the "?" help key */
  if(k==='?'){e.preventDefault();kbHelp();return;}
  /* question screen shortcuts */
  if(cur==='work'&&SES&&!modal){
    if(e.altKey&&e.code==='KeyH'||(!letterKind&&(k==='h'||k==='H'))){e.preventDefault();var hb=$('#wHint');if(hb)hb.click();return;}
    if(e.altKey&&e.code==='KeyS'||(!letterKind&&(k==='s'||k==='S'))){e.preventDefault();var sb=$('#wSay');if(sb)sb.click();return;}
    if(e.altKey&&e.code==='KeyV'||(!letterKind&&(k==='v'||k==='V'))){var vb=$('#wMic');if(vb){e.preventDefault();vb.click();return;}}
    if(kind==='choice'&&/^[1-9]$/.test(k)){var os=document.querySelectorAll('#qui .opt'),o=os[+k-1];if(o){e.preventDefault();o.click();}return;}
    if(kind==='choice'&&/^[a-dA-D]$/.test(k)){var os2=document.querySelectorAll('#qui .opt'),o2=os2['abcd'.indexOf(k.toLowerCase())];if(o2){e.preventDefault();o2.click();}return;}
  }

  /* arrow keys move around like a game controller */
  if(/^Arrow(Up|Down|Left|Right)$/.test(k)&&!isRadio){if(spatial(k))e.preventDefault();return;}
  if(k===' '&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();}
},false);

/* ---- Game: Word Find ---- */
const WFC=['#ffc2d4','#bfe6ff','#c8f2b0','#ffe08a','#dac6ff','#ffd2a8'];
function gameWordFind(){
  var body=gameShell('🔎 Word Find','#1fa3a3'),r=makeRng(Date.now()>>>0,mkHist(true)),N=9,seen={},pool=[],grid=[],placed=[],i,j,found=0,start=null,downC=null,fi=0;
  W3.concat(TECHW).forEach(function(w){if(!seen[w[0]]&&w[0].length<=5){seen[w[0]]=1;pool.push(w);}});
  for(i=0;i<N;i++){grid.push([]);for(j=0;j<N;j++)grid[i].push('');}
  var dirs=[[0,1],[1,0],[1,1],[0,-1]];   /* right, down, diagonal, and BACKWARDS */
  r.fresh(pool,6).forEach(function(w){
    var W=w[0].toUpperCase(),ok=false,t,d,sr,sc,k,er,ec,fit,g;
    for(t=0;t<500&&!ok;t++){
      d=dirs[r.int(0,dirs.length-1)];sr=r.int(0,N-1);sc=r.int(0,N-1);
      er=sr+d[0]*(W.length-1);ec=sc+d[1]*(W.length-1);
      if(er<0||er>=N||ec<0||ec>=N)continue;
      fit=true;for(k=0;k<W.length;k++){g=grid[sr+d[0]*k][sc+d[1]*k];if(g&&g!==W.charAt(k)){fit=false;break;}}
      if(!fit)continue;
      for(k=0;k<W.length;k++)grid[sr+d[0]*k][sc+d[1]*k]=W.charAt(k);
      placed.push({w:W,e:w[1],sr:sr,sc:sc,d:d,ok:false});ok=true;
    }
  });
  var ABC='ABCDEFGHIJKLMNOPRSTUWY';
  for(i=0;i<N;i++)for(j=0;j<N;j++)if(!grid[i][j])grid[i][j]=ABC.charAt(r.int(0,ABC.length-1));
  var h='<div class="qprompt">Find the hidden words! Some go <b>backwards</b> too. Tap the first and last letter, or slide your finger across.</div><div class="wfwrap"><div class="wgrid" id="wg" style="grid-template-columns:repeat('+N+',58px)">';
  for(i=0;i<N;i++)for(j=0;j<N;j++)h+='<div class="wc" data-r="'+i+'" data-c="'+j+'">'+grid[i][j]+'</div>';
  h+='</div><div class="wbank"><h3>Word bank</h3>'+placed.map(function(p){return '<div class="wb" data-w="'+p.w+'"><span class="wbe">'+p.e+'</span><span class="wbt">'+p.w+'</span><span class="wbk">✔</span></div>';}).join('')+'<button class="btn ghost sm" id="wHint" type="button">💡 Hint</button></div></div>';
  body.innerHTML=h;gInfo('Found 0 / '+placed.length);
  var cellAt=function(a){return $('#wg').children[a[0]*N+a[1]];};
  function clearStart(){if(start){cellAt(start).classList.remove('st');start=null;}}
  function attempt(a,b){
    var dr=b[0]-a[0],dc=b[1]-a[1],len=Math.max(Math.abs(dr),Math.abs(dc))+1;
    clearStart();
    if(len<2||!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))){SFX.bad();return;}
    var sr=dr?dr/Math.abs(dr):0,sc=dc?dc/Math.abs(dc):0,s='',cells=[],k;
    for(k=0;k<len;k++){var rr=a[0]+sr*k,cc=a[1]+sc*k;s+=grid[rr][cc];cells.push(cellAt([rr,cc]));}
    var rev=s.split('').reverse().join(''),hit=null;
    placed.forEach(function(p){if(!p.ok&&(p.w===s||p.w===rev))hit=p;});
    if(!hit){SFX.bad();cells.forEach(function(c){shk(c);});return;}
    hit.ok=true;found++;var col=WFC[fi++%WFC.length];
    cells.forEach(function(c){c.classList.add('fd');c.style.background=col;});
    var b2=body.querySelector('.wb[data-w="'+hit.w+'"]');b2.classList.add('found');b2.style.background=col;
    SFX.ok();say(hit.w.toLowerCase().split('').join(', ')+'. '+hit.w.toLowerCase());gInfo('Found '+found+' / '+placed.length);
    if(found===placed.length)setTimeout(function(){resultModal(true,'All words found!','You found '+placed.length+' hidden words!',gameWordFind);},700);
  }
  function cellOf(e){var t=document.elementFromPoint(e.clientX,e.clientY);t=t&&t.closest?t.closest('.wc'):null;return t?[+t.getAttribute('data-r'),+t.getAttribute('data-c')]:null;}
  var wg=$('#wg');
  wg.addEventListener('pointerdown',function(e){e.preventDefault();downC=cellOf(e);});
  wg.addEventListener('pointerup',function(e){
    e.preventDefault();var up=cellOf(e);if(!downC||!up){downC=null;return;}ac();
    if(downC[0]!==up[0]||downC[1]!==up[1]){attempt(downC,up);}
    else if(!start){start=up;cellAt(up).classList.add('st');SFX.pop();}
    else if(start[0]===up[0]&&start[1]===up[1]){clearStart();}
    else attempt(start,up);
    downC=null;
  });
  wg.addEventListener('pointercancel',function(){downC=null;});
  $('#wHint').addEventListener('click',function(){
    var left=placed.filter(function(p){return !p.ok;});if(!left.length)return;
    var p=left[0],c=cellAt([p.sr,p.sc]);c.classList.add('hnt');setTimeout(function(){c.classList.remove('hnt');},1800);toast('💡 Look for '+p.w+' starting at the glowing letter');
  });
}

/* ---- Game: Code Runner (real-time moves) ---- */
const DRn=[-1,0,1,0],DCn=[0,1,0,-1],CSYM={F:'↑',L:'↺',R:'↻'},CNAME={F:'↑ Forward',L:'↺ Turn left',R:'↻ Turn right'};
function gameBot(){
  var body=gameShell('🤖 Code Runner','#34c77b'),set=S.botSet%3,li=0,trace=[],busy=false,timer=0,L,pos,dir;
  CL.push(function(){clearTimeout(timer);});
  body.innerHTML='<div class="qprompt" id="bMsg"></div><div class="bgrid" id="bGrid"></div><div class="prog" id="bProg"></div><div class="center"><button class="btn big cmdb" id="cF" type="button">↑ Forward</button><button class="btn big cmdb" id="cL" type="button">↺ Left</button><button class="btn big cmdb" id="cR" type="button">↻ Right</button></div><div class="row" style="justify-content:center"><button class="btn ghost" id="bClr" type="button">↩ Start again</button><button class="btn ghost" id="bHint" type="button">💡 Hint</button></div>';
  function msg(h){$('#bMsg').innerHTML=h;}
  function blocked(r,c){if(r<0||r>4||c<0||c>4)return 'the edge';var x=null;L.o.forEach(function(o){if(o[0]===r&&o[1]===c)x=o[2]==='🌲'?'a tree':'a mountain';});return x;}

    var h='',r,c;
    for(r=0;r<5;r++)for(c=0;c<5;c++){
      var inner='';if(r===L.g[0]&&c===L.g[1])inner='🏢';
      L.o.forEach(function(o){if(o[0]===r&&o[1]===c)inner=o[2];});

      h+='<div class="bc'+((r===L.g[0]&&c===L.g[1])?' goal':'')+'">'+inner+'</div>';
    }
    $('#bGrid').innerHTML=h;
  }
  function drawTrace(){var t=trace.slice(-24);$('#bProg').innerHTML=trace.length?t.map(function(x){return '<span class="pc'+(x.bad?' bad':'')+'">'+CSYM[x.c]+'</span>';}).join(''):'<small>Press a button: the 🤖 moves right away! ⬇️</small>';}
  function load(){L=BOTLV[set*3+li];pos=L.s.slice();dir=L.d;trace=[];busy=false;draw();drawTrace();gInfo('Level '+(li+1)+' / 3');msg('Guide the 🤖 to the 🏢!<br><small>The ▲ shows which way it faces.</small>');}

  }
  function move(c){
    if(busy)return;ac();var bad=false;

    else if(c==='R'){dir=(dir+1)%4;SFX.pop();}
    else{
      var nr=pos[0]+DRn[dir],nc=pos[1]+DCn[dir],bl=blocked(nr,nc);
      if(bl){bad=true;SFX.bad();msg('💥 Bump! There is '+(bl==='the edge'?'the edge':bl)+' in the way. Turn and try another way!');shk($('#bGrid'));}
      else{pos=[nr,nc];SFX.key();msg('Keep going! 🤖');}
    }

    if(pos[0]===L.g[0]&&pos[1]===L.g[1])win();

  $('#cF').addEventListener('click',function(){move('F');});$('#cL').addEventListener('click',function(){move('L');});$('#cR').addEventListener('click',function(){move('R');});
  $('#bClr').addEventListener('click',function(){if(!busy){clearTimeout(timer);load();}});
  $('#bHint').addEventListener('click',function(){

  });

}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function lastNDays(n){var a=[],t=Date.now(),i;for(i=n-1;i>=0;i--)a.push(ymd(new Date(t-i*864e5)));return a;}
function pctOf(f,n){return n?Math.round(f/n*100):0;}
function histDay(d){return S.hist[d]||(S.hist[d]={n:0,f:0,ms:0,ws:0,qz:0});}

/* ===== answer log (local only, never sent anywhere) ===== */
function logAns(q,ok,wr){

    if(SES&&SES.noLog)return;
    var d=todayStr(),ms=Math.min(Date.now()-(QS.t0||Date.now()),120000),first=(ok&&wr===0)?1:0,dom=q.domain||'cs',top=q.topic||'Other';
    S.log.push({t:Date.now(),d:d,dom:dom,top:top,f:first,ms:ms});if(S.log.length>600)S.log.splice(0,S.log.length-600);
    var a=S.stat[top]||(S.stat[top]={n:0,f:0,dom:dom});a.n++;a.f+=first;a.dom=dom;
    var b=S.dom[dom]||(S.dom[dom]={n:0,f:0});b.n++;b.f+=first;
    var h=histDay(d);h.n++;h.f+=first;h.ms+=ms;
    if(q.cid){var c=S.custom.filter(function(x){return x.id===q.cid;})[0];if(c){c.n=(c.n||0)+1;c.f=(c.f||0)+first;}}
    if(SES){if(!SES.sid)SES.sid=Date.now();var s=S.sess.filter(function(x){return x.id===SES.sid;})[0];
      if(!s){s={id:SES.sid,d:d,k:SES.kind,n:0,f:0,ms:0};S.sess.push(s);if(S.sess.length>80)S.sess.shift();}
      s.n++;s.f+=first;s.ms+=ms;}
  }catch(e){}
}

/* ===== adaptive difficulty: last 12 answers per area ===== */
function adaptLevel(dom){
  try{
    if(dom==='custom'||S.setup.adapt===false||!S.log)return 0;
    var a=S.log.filter(function(x){return x.dom===dom;}).slice(-12);if(a.length<6)return 0;
    var f=a.filter(function(x){return x.f;}).length/a.length;
    return f<.5?-1:(a.length>=8&&f>=.88)?1:0;
  }catch(e){return 0;}
}

function customToQ(c){

  var topic='Syllabus: '+(c.subj||'School'),say=c.say||c.prompt,q,i;

  }else if(c.type==='blank'){

  }else if(c.type==='match'){

    q={kind:'drag',multi:false,prompt:esc(c.prompt),say:say,items:shuf(items),targets:targets,map:map};

function pickCustom(date,n){
  var pool=(S.custom||[]).filter(function(c){return c.on!==false;});if(!pool.length||n<=0)return [];
  pool.sort(function(a,b){return ((a.last===date)?1:0)-((b.last===date)?1:0)||(a.used||0)-(b.used||0)||(a.created||0)-(b.created||0);});
  var out=pool.slice(0,n);out.forEach(function(c){c.used=(c.used||0)+1;c.last=date;});
  return out.map(function(c){try{return customToQ(c);}catch(e){return null;}}).filter(Boolean);
}
function readImage(file,cb){
  try{
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();im.onload=function(){try{
      var M=320,s=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));
      var x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72));}catch(e){cb('');}};im.onerror=function(){cb('');};im.src=fr.result;};
    fr.onerror=function(){cb('');};fr.readAsDataURL(file);
  }catch(e){cb('');}
}

const VOX={voices:[],ready:false,rate:.95,pitch:1.1,keep:[]};
const VOICE_GOOD={ava:40,samantha:38,zoe:36,allison:34,evan:30,nicky:32,tessa:30,veena:30,karen:28,moira:28,serena:26,susan:24,fiona:24,kate:24,daniel:22,rishi:22,aaron:20,siri:18};

  try{
    var n=String(v.name||'').toLowerCase(),l=String(v.lang||'').toLowerCase().replace('_','-'),sc=0;
    if(l.indexOf('en')!==0)return -1;
    if(VOICE_BAD.test(n))return -50;

    if(/google|online/.test(n))sc+=30;
    Object.keys(VOICE_GOOD).forEach(function(k){if(n.indexOf(k)>=0)sc+=VOICE_GOOD[k];});

}

/* say(text, force, {rate,pitch,onend}) : speaks sentence by sentence with a little expression */
function say(t,force,o){
  if((!S.setup.speak&&!force)||!('speechSynthesis' in window)||!t)return;
  o=o||{};
  var finished=false,done=function(){if(finished)return;finished=true;if(o.onend){try{o.onend();}catch(e){}}};
  try{
    var go1=function(){
      try{
        var v=pickVoice(),text=String(t).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),parts=text.match(/[^.!?…]+[.!?…]*/g)||[text],k=0;
        VOX.keep=[];
        parts.forEach(function(p,i){
          p=p.trim();if(!p)return;
          var u=new SpeechSynthesisUtterance(p),last=(i===parts.length-1),q=/\?$/.test(p),ex=/!$/.test(p);
          u.rate=Math.max(.5,Math.min(1.4,(o.rate||VOX.rate)*(ex?1.03:1)));
          u.pitch=Math.max(.5,Math.min(1.8,(o.pitch||VOX.pitch)+(ex?.08:q?.12:0)));
          u.volume=1;

          if(!k&&o.onstart)u.onstart=function(){try{o.onstart();}catch(e){}};

        });

const VNUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten'};
function normWords(s){
  s=String(s||'').toLowerCase().replace(/wi[\s-]?fi|why[\s-]?fi/g,'wifi').replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ');
  return s.split(/\s+/).filter(Boolean).map(function(w){if(VNUMW[w])w=VNUMW[w];if(w==='color')w='colour';if(w==='colors')w='colours';return w;});
}
function lev1(a,b){
  if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;
  var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}
  return d+(a.length-i)+(b.length-j)<=1;
}
function sameWord(a,b){
  if(a===b)return true;
  var sa=a.replace(/s$/,''),sb=b.replace(/s$/,'');if(sa===sb&&sa.length>=3)return true;
  return a.length>=5&&b.length>=5&&lev1(a,b);
}
/* LCS-style alignment so word order counts; returns which target words were heard */
function matchSentence(target,heard){
  var T=normWords(target),H=normWords(heard),n=T.length,m=H.length,i,j,L=[];
  for(i=0;i<=n;i++){L.push([]);for(j=0;j<=m;j++)L[i].push(0);}
  for(i=1;i<=n;i++)for(j=1;j<=m;j++)L[i][j]=sameWord(T[i-1],H[j-1])?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1]);
  var ok=new Array(n).fill(false);i=n;j=m;
  while(i>0&&j>0){if(sameWord(T[i-1],H[j-1])&&L[i][j]===L[i-1][j-1]+1){ok[i-1]=true;i--;j--;}else if(L[i-1][j]>=L[i][j-1])i--;else j--;}
  var got=ok.filter(Boolean).length,need=Math.max(1,Math.ceil(n*.75));

/* ===== 3. family voice notes ===== */
function notePick(){
  if(S.setup.notes===false)return null;
  var l=(S.vnotes||[]).filter(function(n){return n.on!==false&&n.data;});if(!l.length)return null;
  var n=l[(S.vnIdx||0)%l.length];S.vnIdx=(S.vnIdx||0)+1;return n;
}
function playNote(n,cb){
  var done=false,fin=function(ok){if(done)return;done=true;if(cb){try{cb(ok);}catch(e){}}};
  try{
    stopSpeak();var a=mediaEl();if(!a){fin(false);return;}
    try{a.pause();}catch(e){}
    a.onended=function(){fin(true);};a.onerror=function(){fin(false);};
    a.src=n.data;a.muted=false;a.volume=1;
    var p=a.play();
    if(p&&p.catch)p.catch(function(){tapToHear(n);fin(false);});   /* blocked by Safari: ask for one tap */
    setTimeout(function(){fin(true);},Math.max(3000,(n.ms||3000)+2500));
  }catch(e){fin(false);}
}
function tapToHear(n){
  var old=document.getElementById('tapnote');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var b=document.createElement('button');b.id='tapnote';b.type='button';b.className='btn big tapnote';b.textContent='💌 Tap to hear a message from '+n.who;
  b.addEventListener('click',function(){unlockMedia();if(b.parentNode)b.parentNode.removeChild(b);playNote(n);});
  document.body.appendChild(b);setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b);},15000);
}
function noteCardHtml(n){
  n=n||notePick();if(!n)return '';FN.cur=n;
  return '<div class="card fnote"><span class="fnico">💌</span><div style="flex:1"><b>A message from '+esc(n.who)+'</b><br><small>Tap to hear it again</small></div><button class="btn sm" data-fnote="'+n.id+'" type="button">▶ Play</button></div>';
}
function noteWin(thenText){            /* returns the card html, plays the note, then Byte says thenText */
  var n=notePick();
  if(!n){if(thenText)setTimeout(function(){say(thenText);},600);return '';}
  setTimeout(function(){playNote(n,function(){if(thenText)setTimeout(function(){say(thenText);},200);});},600);
  return noteCardHtml(n);
}
function familyThenSay(text){var n=FN.cur;FN.cur=null;if(!n){n=notePick();}if(!n){setTimeout(function(){say(text);},700);return;}FN.cur=n;setTimeout(function(){playNote(n,function(){setTimeout(function(){say(text);},200);});},700);}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-fnote]');if(!b)return;ac();unlockMedia();var id=b.getAttribute('data-fnote'),n=(S.vnotes||[]).filter(function(x){return x.id===id;})[0];if(n)playNote(n);});

/* --- parent: record / upload --- */
var REC={mr:null,stream:null,chunks:[],timer:null,tick:null};
function fnMsg(t,bad){var m=$('#fnMsg');if(!m)return;m.style.display=t?'block':'none';m.className='note '+(bad?'badn':'good');m.textContent=t||'';}
function addNote(who,data,mime,ms){
  if((S.vnotes||[]).length>=6){fnMsg('You can keep up to 6 notes. Delete one first.',true);return false;}
  if(data.length>450000){fnMsg('That clip is too big. Keep it to a few seconds.',true);return false;}
  var total=(S.vnotes||[]).reduce(function(a,n){return a+n.data.length;},0)+data.length;
  if(total>1600000){fnMsg('Notes use too much space. Delete an old one first.',true);return false;}
  var n={id:rid(5),who:who,data:data,mime:mime||'',ms:ms||3000,on:true,created:Date.now()};S.vnotes.push(n);
  if(!saveOk()){S.vnotes.pop();fnMsg('The iPad storage is full, so this note could not be saved.',true);return false;}
  return true;
}
function blobToData(blob,cb){try{var fr=new FileReader();fr.onload=function(){cb(String(fr.result||''));};fr.onerror=function(){cb('');};fr.readAsDataURL(blob);}catch(e){cb('');}}
function recStop(){try{if(REC.mr&&REC.mr.state!=='inactive')REC.mr.stop();}catch(e){}}
function recStart(who){
  if(REC.mr){recStop();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){fnMsg('Recording is not available in this browser. Please use Upload audio instead.',true);return;}
  fnMsg('');
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mt=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].filter(function(t){try{return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t);}catch(e){return false;}})[0],mr;
    try{mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(function(t){t.stop();});fnMsg('Could not start recording here. Please use Upload audio.',true);return;}
    REC.mr=mr;REC.stream=stream;REC.chunks=[];var t0=Date.now(),btn=$('#fnRec');
    mr.ondataavailable=function(e){if(e.data&&e.data.size)REC.chunks.push(e.data);};
    mr.onstop=function(){
      clearTimeout(REC.timer);clearInterval(REC.tick);try{stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
      var ms=Date.now()-t0,type=mr.mimeType||mt||'audio/mp4',blob=new Blob(REC.chunks,{type:type});REC.mr=null;
      var b2=$('#fnRec');if(b2){b2.classList.remove('rec');b2.textContent='🎙️ Record (up to 5 sec)';}
      blobToData(blob,function(d){if(!d||d.length<200){fnMsg('Nothing was recorded. Try again.',true);return;}if(addNote(who(),d,type,ms)){SFX.ok();renderParent();}});
    };
    try{mr.start();}catch(e){REC.mr=null;fnMsg('Could not start recording.',true);return;}
    if(btn){btn.classList.add('rec');btn.textContent='⏹ Stop (5)';}
    REC.tick=setInterval(function(){var left=Math.max(0,5-Math.floor((Date.now()-t0)/1000)),b=$('#fnRec');if(b)b.textContent='⏹ Stop ('+left+')';},250);
    REC.timer=setTimeout(recStop,5000);                                     /* notes are short on purpose */
  }).catch(function(){fnMsg('The microphone is blocked. Allow it in Safari settings, or use Upload audio.',true);});
}
function famHtml(){
  var l=S.vnotes||[],who=['Dad','Mom','Family','Grandparents'];
  return '<div class="card"><h3>💌 Family voice notes</h3><p class="sub" style="margin:0 0 8px">Record or upload a short message (about 3 seconds), like “Great job, Rudraksh! Proud of you!”. Byte plays one when he finishes the worksheet, wins a game or does well in a quiz.</p>'+
    '<div class="row" style="align-items:center"><select id="fnWho" class="fi" style="width:auto">'+who.map(function(w){return '<option>'+w+'</option>';}).join('')+'</select><button class="btn sm" id="fnRec" type="button">🎙️ Record (up to 5 sec)</button><label class="btn ghost sm" style="cursor:pointer">⬆️ Upload audio<input type="file" id="fnUp" accept="audio/*" style="display:none"></label></div>'+
    '<div class="note" id="fnMsg" style="display:none"></div><div id="fnList">'+(l.length?l.map(function(n){return '<div class="cqrow"><span class="ctag">'+esc(n.who)+'</span><div class="cqt"><b>'+(Math.round((n.ms||0)/100)/10)+' sec voice note</b><small>'+new Date(n.created).toLocaleDateString()+(n.on===false?' · paused':'')+'</small></div><button type="button" class="btn ghost sm" data-fn="pl" data-id="'+n.id+'" title="Play">▶</button><button type="button" class="btn ghost sm" data-fn="on" data-id="'+n.id+'" title="Pause / resume">'+(n.on===false?'▷':'⏸')+'</button><button type="button" class="btn ghost sm" data-fn="rm" data-id="'+n.id+'" title="Delete">🗑️</button></div>';}).join(''):'<p class="sub">No notes yet.</p>')+'</div>'+
    '<div class="row"><button class="btn ghost sm" id="fnOn" type="button">'+(S.setup.notes===false?'💌 Family notes: off':'💌 Family notes: on')+'</button></div><small>Stored only on this iPad (and in your backup file).</small></div>';
}
function alarmHtml(){
  return '<div class="card"><h3>⏰ Evening reminder</h3><p class="sub" style="margin:0 0 8px">From 3:30 PM to 9:30 PM, if today\'s worksheet is not finished and the app sits untouched, Byte speaks and shows a big pop-up. It repeats every hour until the worksheet is done.</p>'+
    '<div class="row" style="align-items:center"><button class="btn ghost sm" id="alToggle" type="button">'+(S.setup.alarm===false?'⏰ Reminder: off':'⏰ Reminder: on')+'</button><label style="font-weight:600">Idle for <select id="alIdle" class="fi" style="width:auto;display:inline-block">'+[10,15,20,30].map(function(m){return '<option'+(m===(S.setup.alarmIdle||15)?' selected':'')+'>'+m+'</option>';}).join('')+'</select> min</label><button class="btn ghost sm" id="alTest" type="button">▶ Test it now</button></div><div class="note good" style="margin-top:8px">'+esc(alarmInfo())+'</div>'+
    '<small>Safari cannot run alarms when the app is closed or the iPad is asleep. Keep the app open on the iPad (Settings → Display &amp; Brightness → Auto-Lock → Never, or use Guided Access).</small></div>'+
    '<div class="card"><h3>🎤 Speak-your-answer</h3><div class="row"><button class="btn ghost sm" id="vqToggle" type="button">'+(S.setup.vq===false?'🎤 Mic answer buttons: off':'🎤 Mic answer buttons: on')+'</button></div><small>Adds a “Say it” button to quiz and custom questions so Rudraksh can answer out loud. Correct spoken answers earn +2 XP.</small></div>';
}
function bindFamily(){
  var q=function(id,fn){var x=$(id);if(x)x.addEventListener('click',fn);};
  var who=function(){var w=$('#fnWho');return w?w.value:'Family';};
  q('#fnRec',function(){ac();recStart(who);});
  var up=$('#fnUp');if(up)up.addEventListener('change',function(){
    var f=up.files&&up.files[0];up.value='';if(!f)return;
    if(f.size>600000){fnMsg('That file is too big. Please use a clip of about 3 to 10 seconds.',true);return;}
    blobToData(f,function(d){
      if(!d){fnMsg('Could not read that file.',true);return;}
      var a=new Audio(),w=who(),finish=function(ms){if(addNote(w,d,f.type,ms)){SFX.ok();renderParent();}};
      a.preload='metadata';var to=setTimeout(function(){finish(3000);},2500);
      a.onloadedmetadata=function(){clearTimeout(to);var s=a.duration;if(isFinite(s)&&s>12){fnMsg('That clip is '+Math.round(s)+' seconds. Please keep it under 12 seconds.',true);return;}finish(isFinite(s)?Math.round(s*1000):3000);};
      a.onerror=function(){clearTimeout(to);fnMsg('That audio file could not be played in Safari. Try a .m4a or .mp3 file.',true);};
      a.src=d;
    });
  });
  q('#fnOn',function(){S.setup.notes=(S.setup.notes===false);save();renderParent();});
  [].forEach.call(document.querySelectorAll('#fnList [data-fn]'),function(b){b.addEventListener('click',function(){
    var id=b.getAttribute('data-id'),n=(S.vnotes||[]).filter(function(x){return x.id===id;})[0],a=b.getAttribute('data-fn');if(!n)return;
    if(a==='pl'){ac();unlockMedia();playNote(n);}else if(a==='on'){n.on=(n.on===false);save();renderParent();}
    else if(a==='rm'){if(confirm('Delete this voice note?')){S.vnotes=S.vnotes.filter(function(x){return x.id!==id;});save();renderParent();}}
  });});
  q('#alToggle',function(){S.setup.alarm=(S.setup.alarm===false);save();if(S.setup.alarm===false)alarmHide();renderParent();});
  var ai=$('#alIdle');if(ai)ai.addEventListener('change',function(){S.setup.alarmIdle=+ai.value;save();renderParent();});
  q('#alTest',function(){ac();unlockMedia();alarmShow(true);});
  q('#vqToggle',function(){S.setup.vq=(S.setup.vq===false);save();renderParent();});
}

/* ---------- 11. BOOT ---------- */
applyKbMode();
function handleHash(){
  var h=location.hash||'';
  if(h.indexOf('reward=')<0)return;
  var raw=h;try{history.replaceState(null,'',location.href.split('#')[0]);}catch(e){}
  if(!S.setup.done){return;}
  go('home');setTimeout(function(){handlePayload(raw);},300);
}
function init(){
  buildTabs();renderSplash();go('splash');setupPWA();initVoices();startAlarm();
  window.addEventListener('hashchange',handleHash);
  if(S.setup.done&&!S.setup.appUrl&&location.protocol.indexOf('http')===0){S.setup.appUrl=location.href.split('#')[0].split('?')[0];save();}
  if((location.hash||'').indexOf('reward=')>=0&&S.setup.done)handleHash();
  document.addEventListener('visibilitychange',function(){if(document.hidden)stopCam();});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
